var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad2(n){ return (n<10?'0':'')+n; }
/* Legacy records store dates as dd.mm.yyyy (or dd/mm/yyyy, dd-mm-yyyy).
   new Date('04.07.2026') is either Invalid or read as US m/d — so parse it
   ourselves before falling back to the native parser. */
function toDate(v){
  if(v instanceof Date) return v;
  var str=String(v||'').trim();
  if(!str) return null;
  var m=str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m){
    var d=+m[1], mo=+m[2], y=+m[3];
    if(d>=1&&d<=31&&mo>=1&&mo<=12) return new Date(y,mo-1,d);
  }
  var nd=new Date(str);
  return isNaN(nd)?null:nd;
}
/* 12-Jan-2026, 09:36 hrs */
function fmtLocal(iso){
  if(!iso) return '—';
  var d=toDate(iso); if(!d) return String(iso);
  var hasTime = /\d{1,2}:\d{2}/.test(String(iso)) || iso instanceof Date;
  var base = pad2(d.getDate())+'-'+MON[d.getMonth()]+'-'+d.getFullYear();
  return hasTime ? base+', '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' hrs' : base;
}
/* 12-Jan-2026 (no time) */
function fmtDate(iso){
  if(!iso) return '—';
  var d=toDate(iso); if(!d) return String(iso);
  return pad2(d.getDate())+'-'+MON[d.getMonth()]+'-'+d.getFullYear();
}
/* minutes -> hh:mm  (hours are not capped at 24) */
function fmtDur(min){
  var m=Number(min);
  if(!isFinite(m)||m<0) return '—';
  m=Math.round(m);
  return pad2(Math.floor(m/60))+':'+pad2(m%60);
}

/* keep the caret inside the editor, run the command, then persist the HTML */
function rtEditor(i){ return document.querySelector('.rtedit[data-i="'+i+'"]'); }
function rtSync(i){ var e=rtEditor(i); if(e && OPBLOCKS[i]) OPBLOCKS[i].html=e.innerHTML; }
function rt(ev,cmd,i){
  ev.preventDefault();
  var e=rtEditor(i); if(e) e.focus();
  document.execCommand(cmd,false,null);
  rtSync(i);
  return false;
}
function rtVal(ev,cmd,val,i){
  if(!val) return;
  var e=rtEditor(i); if(e) e.focus();
  if(cmd==='hiliteColor'){
    /* Firefox needs styleWithCSS for highlight; Chrome accepts either */
    try{ document.execCommand('styleWithCSS',false,true); }catch(_){}
    if(!document.execCommand('hiliteColor',false,val)) document.execCommand('backColor',false,val);
  } else {
    if(cmd==='foreColor'){ try{ document.execCommand('styleWithCSS',false,true); }catch(_){} }
    document.execCommand(cmd,false,val);
  }
  rtSync(i);
}
function addBlock(){ OPBLOCKS.push({label:'',html:''}); paintBlocks(); }
function rmBlock(ev,i){ ev.preventDefault(); OPBLOCKS.splice(i,1); paintBlocks(); return false; }
function toLocalInput(iso){ if(!iso)return ''; var d=new Date(iso); if(isNaN(d))return '';
  var p=function(n){return('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function calcDur(){
  var a=document.getElementById('opFrom').value,b=document.getElementById('opTo').value;
  if(a&&b){ var m=Math.round((new Date(b)-new Date(a))/60000); document.getElementById('opDur').value = m>=0?fmtDur(m)+' (hh:mm)':'end is before start'; }
}
function saveOp(id){
  var from=document.getElementById('opFrom').value, to=document.getElementById('opTo').value;
  var dur = (from&&to)? Math.max(0,Math.round((new Date(to)-new Date(from))/60000)) : 0;
  var op={ id:id||undefined, ltsId:document.getElementById('opLts').value, opTitle:val('opTitle'),
    interruptFrom: from?new Date(from).toISOString():'', interruptTo: to?new Date(to).toISOString():'',
    durationMin:dur, blocks:OPBLOCKS };
  if(!op.ltsId){toast('Select an LTS','err');return;}
  busy(true);
  api('apiSaveOperation',S.token,S.sub,op).then(function(){busy(false);closeModal();toast('Operation saved','ok');S.opsLoaded=null;renderOps();loadSub();})
    .catch(function(e){busy(false);toast(e.message,'err');});
}
function delOp(id){ if(!confirm('Delete this operation record?'))return;
  api('apiDeleteOperation',S.token,S.sub,id).then(function(){toast('Deleted','ok');S.opsLoaded=null;renderOps();loadSub();}).catch(function(e){toast(e.message,'err');}); }

   EXPORT
============================================================= */
/* data: URLs are size-capped in Chrome and blocked on iOS Safari, which is
   why PDF downloads failed. Convert base64 -> Blob -> object URL instead. */
function b64ToBlob(b64,mime){
  var bin=atob(b64), len=bin.length, buf=new Uint8Array(len);
  for(var i=0;i<len;i++) buf[i]=bin.charCodeAt(i);
  return new Blob([buf],{type:mime||'application/octet-stream'});
}
function saveBlob(blob,fileName){
  if(window.navigator && window.navigator.msSaveOrOpenBlob){ window.navigator.msSaveOrOpenBlob(blob,fileName); return; }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=fileName; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
}
function exportIt(scope,fmt,id,opts){
  busy(true);
  api('apiExport',S.token,S.sub,fmt,scope,id||'',opts||null).then(function(r){
    busy(false);
    saveBlob(b64ToBlob(r.base64,r.mimeType), r.fileName);
    toast('Downloaded '+r.fileName,'ok');
  }).catch(function(e){busy(false);toast(e.message,'err');});
}
/* the date-range chosen in the Operations export menu */
function rangeOpts(){
  if(OPRANGE.mode==='all') return null;
  if(OPRANGE.mode==='fy'){
    var b=fyBounds();
    var iso=function(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
    return {from:iso(b.from),to:iso(b.to)};
  }
  return {from:OPRANGE.from||'',to:OPRANGE.to||''};
}

function stripHtmlC(h){ return String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim(); }

function previewData(scope,id){
  if(scope==='single'){
    var l=(CUR&&CUR.lts)||{};
    var rows=[
      ['Sr No',l.srNo],['Scheme end',l.endType==='other'?'Other substation end':'Own substation end'],
      ['Division',l.division],['Substation',l.substation],['Status',l.status],['Date',l.date],
      ['ICT / Line',l.tfIct],['HV/LV',l.hvLv],['Connected CTR',l.ctr],['Relay',l.relayType],
      ['Max load recorded',l.maxLoad],['Alarm PSM setting',l.alarmPsm],
      ['Stage-1 (Trip)',l.stage1],['Stage-2 (Trip)',l.stage2],
      ['Feeders in scheme',l.feeders],['Load relief (obtd/reqd)',l.loadRelief],
      ['Remarks / purpose',l.remarks],['Healthiness',l.healthiness],
      ['Last operated (from Operations log)',l.lastOpDate?fmtLocal(l.lastOpDate):'Never operated']
    ];
    ((CUR&&CUR.customFields)||[]).forEach(function(c){ rows.push([c.fieldName,c.fieldValue]); });
    return { title:'LTS '+(l.srNo||'')+' — '+(l.tfIct||''), head:['Field','Value'], rows:rows, kv:true };
  }
  if(scope==='ops' || scope==='op1'){
    var head=['LTS','Operation','Interruption From','Interruption To','Duration (hh:mm)','Details','Logged by'];
    var src=(S.ops||[]);
    if(scope==='op1') src=src.filter(function(o){return o.id===id;});
    else src=opsInRange(src).slice().sort(function(a,b){ return new Date(b.interruptFrom)-new Date(a.interruptFrom); });

      var text=(o.blocks||[]).map(function(b){ return (b.label?b.label+': ':'')+stripHtmlC(b.html); }).join('\n\n');
      return [o.ltsName,o.opTitle,fmtLocal(o.interruptFrom),fmtLocal(o.interruptTo),fmtDur(o.durationMin),text,o.createdBy];
    });

      : 'Operations Log — '+subMeta().name+' · '+rangeLabel()+' ('+rows.length+')';
    return { title:t, head:head, rows:rows };
  }
  if(scope==='outages'){
    var rows2=(CUR_OUT||[]).map(function(o){
      return [fmtLocal(o.fromDateTime),fmtLocal(o.toDateTime),fmtDur(o.durationMin),
        o.findings||'',o.remarks||'',o.testingId?'Yes':'No',o.createdBy];
    });
    return { title:'LTS Outages — '+shorten((CUR&&CUR.lts&&CUR.lts.tfIct)||'',40)+' ('+rows2.length+')',
      head:['From','To','Duration (hh:mm)','Findings','Remarks','From testing','Logged by'], rows:rows2 };
  }
  if(scope==='testing' || scope==='ltstest1'){
    var src2=(CUR_TEST||[]);
    if(scope==='ltstest1') src2=src2.filter(function(t){return t.id===id;});
    var rows3=src2.map(function(t){
      return [t.cause,fmtLocal(t.fromDateTime),fmtLocal(t.toDateTime),fmtDur(t.durationMin),
        t.findings||'',t.remarks||'',t.createdBy];
    });
    var tt=scope==='ltstest1' ? 'LTS Testing — '+((src2[0]&&src2[0].cause)||'')
      : 'LTS Testing — '+shorten((CUR&&CUR.lts&&CUR.lts.tfIct)||'',40)+' ('+rows3.length+')';
    return { title:tt, head:['Cause','From','To','Duration (hh:mm)','Findings','Remarks','Logged by'], rows:rows3 };
  }
  /* list */
  var head=['Sr','End','ICT / Line','HV/LV','CTR','Relay','Max Load','Alarm PSM','Stage-1 Trip',
    'Stage-2 Trip','Feeders in scheme','Load Relief (Obtd/Reqd)','Remarks','Healthy','Last Op','Status','Date'];
  var list=(S.lists.own||[]).concat(S.lists.other||[]);
  var rows=list.map(function(l){
    return [l.srNo,l.endType==='other'?'Other':'Own',l.tfIct,l.hvLv,l.ctr,l.relayType,l.maxLoad,l.alarmPsm,
      l.stage1,l.stage2,l.feeders,l.loadRelief,l.remarks,l.healthiness,
      l.lastOpDate?fmtDate(l.lastOpDate):'Never',l.status,l.date]; });
  return { title:'All LTS — '+subMeta().name+' ('+rows.length+')', head:head, rows:rows };
}

/* =============================================================
   LTS DIAGRAM  — per-LTS, derived from that scheme's own data
   Nothing here is substation-specific. Everything is read from the
   LTS record: voltage levels parsed from the ICT/line description,
   CTR, relay, stage settings and the feeder list.
============================================================= */

/* ---------- 1. Interpret an LTS record ---------- */
/* Pull every voltage mentioned, high to low.
   Handles bare "400 kV" and grouped "400/220/33 kV" (only the last number
   carries the unit, so the whole slash-group must be expanded). */
function kvLevels(str){
  var out=[];
  var re=/((?:\d+(?:\.\d+)?\s*\/\s*)*\d+(?:\.\d+)?)\s*k\.?\s*v/gi, m;
  while((m=re.exec(String(str||'')))){
    m[1].split('/').forEach(function(p){
      var v=parseFloat(p);
      if(!isNaN(v)) out.push(v);
    });
  }
  return out.filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return b-a;});
}
function num(str,unit){
  var re = new RegExp('(\\d+(?:\\.\\d+)?)\\s*' + unit, 'i');
  var m = String(str||'').match(re);
  return m ? parseFloat(m[1]) : null;
}
/* split a feeder blob on commas / slashes / "and" / newlines */
function feederList(str){
  return String(str||'').split(/[,\n;]+|\band\b|\+/i)
    .map(function(x){return x.replace(/\s+/g,' ').trim();})
    .filter(function(x){return x.length>1;});
}

/* Classify the scheme from its own fields — no substation names involved. */
function ltsKind(l){
  var hay=((l.relayType||'')+' '+(l.remarks||'')+' '+(l.tfIct||'')+' '+(l.stage1||'')).toLowerCase();
  if(/under\s*volt|\buv\b/.test(hay)) return 'uv';
  if(/\bict\b|transformer|mva/.test(hay)) return 'ict';
  if(/ckt|circuit|line|feeder/.test(hay)) return 'line';
  return 'ict';
}

function ltsModel(l){
  var kvs=kvLevels(l.tfIct);
  if(!kvs.length) kvs=kvLevels(l.hvLv);
  var kind=ltsKind(l);
  var feeders=feederList(l.feeders);
  var relief=num(l.loadRelief,'MW');
  return {
    kind:kind,
    kvHigh:kvs[0]||null,
    kvMid:kvs[1]||null,
    kvLow:kvs[2]||kvs[1]||null,
    source:(kvs[0]?kvs[0]+' kV':'')+' SOURCE',
    plant:l.tfIct||'Protected element',
    ctr:l.ctr||'',
    relay:l.relayType||'',
    maxA:num(l.maxLoad,'A'),
    maxMW:num(l.maxLoad,'MW'),
    stage1:l.stage1||'',
    stage2:l.stage2||'',
    alarm:l.alarmPsm||'',
    relief:relief,
    feeders:feeders.slice(0,6),
    feederMore:Math.max(0,feeders.length-6),
    plcc:/plcc/i.test(l.feeders||'')
  };
}

/* ---------- 2. Auto-generated SVG from the model ---------- */
var SIM={raf:null,t:0,mode:'normal',relief:0,pct:0};

function autoDiagram(m){
  var W=1000,H=430;
  var fx=760, n=Math.max(m.feeders.length,1);
  var gap=Math.min(78,(H-120)/n);
  var y0=(H-(n-1)*gap)/2;

  var feeders=m.feeders.map(function(f,i){
    var y=y0+i*gap;
    return '<g class="fdr" data-i="'+i+'">'+
      '<line class="cond c-fdr f'+i+'" x1="640" y1="'+y+'" x2="'+fx+'" y2="'+y+'"/>'+
      '<rect class="bkr b-fdr f'+i+'" x="672" y="'+(y-9)+'" width="18" height="18" rx="2"/>'+
      '<circle class="dot d'+i+'" cx="640" cy="'+y+'" r="0"/>'+
      '<text class="lead" x="'+(fx+8)+'" y="'+(y+4)+'">'+esc(shorten(f,26))+'</text>'+
    '</g>';
  }).join('');

  var midLbl = m.kvMid? m.kvMid+' kV' : 'LV';
  var lowLbl = m.kvLow && m.kvLow!==m.kvMid ? ' / '+m.kvLow+' kV' : '';

  return '<svg id="sld" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<defs><linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#3ac2e6" stop-opacity="0"/>'+
      '<stop offset=".5" stop-color="#3ac2e6"/><stop offset="1" stop-color="#3ac2e6" stop-opacity="0"/></linearGradient></defs>'+

    /* source */
    '<line class="cond c-src" x1="60" y1="110" x2="60" y2="60"/>'+
    '<circle class="src" cx="60" cy="48" r="13"/>'+
    '<text class="node-lab" x="18" y="30">'+esc(m.source)+'</text>'+
    '<line class="cond c-src" x1="60" y1="110" x2="200" y2="110"/>'+
    '<rect class="bkr b-src" x="118" y="101" width="18" height="18" rx="2"/>'+

    /* protected element (ICT or line) */
    (m.kind==='ict'
      ? '<circle class="wdg" cx="230" cy="110" r="24"/><circle class="wdg" cx="230" cy="146" r="24"/>'+
        '<text class="node-lab" x="264" y="120">'+esc(shorten(m.plant,34))+'</text>'+
        '<line class="cond c-ict" x1="230" y1="170" x2="230" y2="215"/>'
      : '<rect class="line-el" x="206" y="96" width="48" height="28" rx="4"/>'+
        '<text class="node-lab" x="264" y="115">'+esc(shorten(m.plant,34))+'</text>'+
        '<line class="cond c-ict" x1="230" y1="124" x2="230" y2="215"/>')+

    /* CT + relay */
    '<circle class="ct" cx="230" cy="192" r="9"/>'+
    '<text class="tiny" x="246" y="196">CT '+esc(m.ctr)+'</text>'+
    '<rect class="relay" id="relayBox" x="60" y="176" width="118" height="34" rx="6"/>'+
    '<text class="tiny bold" x="70" y="197">'+esc(shorten(m.relay,16))+'</text>'+
    '<line class="trip" id="tripLine" x1="178" y1="193" x2="221" y2="192"/>'+

    /* bus */
    '<line class="bus c-bus" x1="120" y1="230" x2="640" y2="230"/>'+
    '<text class="node-lab" x="120" y="252">'+esc(midLbl+lowLbl)+' BUS</text>'+

    /* PLCC / command path */
    (m.plcc
      ? '<rect class="plcc" id="plccBox" x="470" y="176" width="96" height="30" rx="6"/>'+
        '<text class="tiny bold" x="484" y="196">PLCC / CARRIER</text>'+
        '<line class="trip" id="plccLink" x1="178" y1="188" x2="470" y2="188"/>'
      : '')+

    /* distribution rail to feeders */
    '<line class="cond c-bus" x1="640" y1="'+(y0-14)+'" x2="640" y2="'+(y0+(n-1)*gap+14)+'"/>'+
    feeders+

    /* relief readout */
    '<text class="tiny" x="'+(fx)+'" y="'+(H-14)+'" id="reliefTxt">Load relief 0 MW</text>'+
  '</svg>';
}

/* ---------- 3. Animation ---------- */
function startSim(m){
  stopSim();
  SIM.model=m; SIM.mode='normal'; SIM.t=0; SIM.relief=0; SIM.pct=0;
  colorCond('c-src','live'); colorCond('c-ict','live'); colorCond('c-bus','live'); colorCond('c-fdr','live');
  tick();
}
function stopSim(){ if(SIM.raf) cancelAnimationFrame(SIM.raf); SIM.raf=null; }

function tick(){
  var m=SIM.model; if(!m){ return; }
  SIM.t+=0.016;
  var svg=document.getElementById('sld');
  if(!svg){ stopSim(); return; }

  var relay=document.getElementById('relayBox');
  var trip=document.getElementById('tripLine');
  var plcc=document.getElementById('plccLink');
  var n=Math.max(m.feeders.length,1);

  if(SIM.mode==='normal'){
    SIM.pct=Math.max(0,SIM.pct-2);
    SIM.relief=Math.max(0,SIM.relief-4);
    if(relay) relay.classList.remove('picked');
    if(trip) trip.classList.remove('hot');
    if(plcc) plcc.classList.remove('hot');
    for(var i=0;i<n;i++) colorCond('f'+i,'live');
  } else {
    /* overload builds, relay picks up, then feeders shed one by one */
    SIM.pct=Math.min(100,SIM.pct+1.6);
    var picked=SIM.pct>45;
    if(relay) relay.classList.toggle('picked',picked && Math.floor(SIM.t*4)%2===0);
    if(trip) trip.classList.toggle('hot',picked);
    if(plcc) plcc.classList.toggle('hot',picked);
    if(SIM.mode==='uv'){ colorCond('c-src','hot'); } else { colorCond('c-ict','hot'); }
    var shed=picked?Math.min(n,Math.floor((SIM.pct-45)/(55/n))+1):0;
    for(var j=0;j<n;j++) colorCond('f'+j, j<shed?'dead':'live');
    var target=m.relief||0;
    SIM.relief=Math.min(target, (shed/n)*target);
  }

  setTxt('reliefTxt','Load relief '+Math.round(SIM.relief)+' MW');
  /* Only these three are live quantities. Everything else on a card is a
     recorded value from the LTS record and must never be invented. */
  if(m.maxA!=null)  setG('g_load', Math.round(m.maxA*(1+SIM.pct/220))+' A');
  if(m.maxMW!=null) setG('g_pow',  Math.round(m.maxMW*(1+SIM.pct/220))+' MW');
  setG('g_psm',  Math.round(SIM.pct)+' %');
  setG('g_relief', Math.round(SIM.relief)+' MW');

  SIM.raf=requestAnimationFrame(tick);
}
function colorCond(cls,state){
  var svg=document.getElementById('sld'); if(!svg)return;
  svg.querySelectorAll('.'+cls).forEach(function(el){
    el.classList.remove('live','hot','dead'); el.classList.add(state); });
}
function setG(id,v){ var e=document.getElementById(id); if(e)e.textContent=v; }
function setTxt(id,v){ var e=document.getElementById(id); if(e)e.textContent=v; }

/* ---------- gauge cards ----------
   kind 'live'  -> animated by the simulation (load / pow / psm / relief)
   kind 'field' -> reads a named field straight off the LTS record
   kind 'text'  -> a value the engineer typed
   Custom cards are stored alongside the diagram scene.               */
var DGCARDS=null;

function defaultCards(m){
  var c=[];
  if(m.kind!=='uv' && m.maxA!=null) c.push({id:'load',kind:'live',label:'Loading'});
  else if(m.kind==='uv')            c.push({id:'load',kind:'field',label:'Voltage threshold',field:'maxLoad'});
  if(m.maxMW!=null) c.push({id:'pow',kind:'live',label:'Power'});
  c.push({id:'psm',kind:'live',label:'Relay PSM (simulated)'});
  c.push({id:'relief',kind:'live',label:'Load relief'});
  c.push({id:'ctr',kind:'field',label:'Connected CTR',field:'ctr'});
  c.push({id:'st1',kind:'field',label:'Stage-1 trip',field:'stage1'});
  return c;
}
function cardValue(c,m){
  if(c.kind==='field'){ return String(CUR.lts[c.field]||'—'); }
  if(c.kind==='text'){ return String(c.value||'—'); }
  switch(c.id){
    case 'load':   return m.maxA!=null? m.maxA+' A' : '—';
    case 'pow':    return m.maxMW!=null? m.maxMW+' MW' : '—';
    case 'psm':    return '0 %';
    case 'relief': return '0 MW';
    default:       return '—';
  }
}
function cardsHtml(m){
  var cards=DGCARDS||defaultCards(m);
  DGCARDS=cards;
  if(!cards.length) return '<div class="empty" style="grid-column:1/-1">No cards. Add one below.</div>';
  return cards.map(function(c,i){
    var live=c.kind==='live';
    return '<div class="gauge'+(live?' live':'')+'">'+
      (CUR.canEdit?'<button class="gdel" title="Remove card" onclick="delCard('+i+')">✕</button>':'')+
      '<div class="lab">'+esc(c.label)+'</div>'+
      '<div class="val"><span'+(live?' id="g_'+c.id+'"':'')+'>'+esc(cardValue(c,m))+'</span></div>'+
      (c.kind==='field'?'<div class="src">from LTS · '+esc(c.field)+'</div>':'')+
    '</div>';
  }).join('');
}
function gauge(lab,id,val,unit){   /* kept for compatibility */
  return '<div class="gauge"><div class="lab">'+esc(lab)+'</div><div class="val"><span id="g_'+id+'">'+
    esc(val)+'</span> <small>'+esc(unit)+'</small></div></div>';

============================================================= */
function printHtml(title,headRow,rows,kv){
  var css=
   '@page{size:A4 landscape;margin:12mm}'+
   'body{font-family:Calibri,Segoe UI,sans-serif;color:#2B2410;margin:0}'+
   'h1{font-family:Georgia,serif;color:#7A5E12;font-size:19px;text-align:center;margin:0 0 3px}'+
   '.sub{text-align:center;font-size:9px;color:#8A7A55;margin:0 0 10px;'+
     'border-bottom:2px solid #B8912F;padding-bottom:7px}'+
   'table{border-collapse:collapse;width:100%;font-size:9.5px}'+
   'th,td{border:1px solid #E2D3A2;padding:5px 7px;text-align:left;vertical-align:top;word-break:break-word}'+
   'thead th{background:#B8912F;color:#fff;font-weight:700}'+
   'tbody tr:nth-child(even){background:#FBF6E6}'+
   'tbody td:first-child{font-weight:700;color:#7A5E12}'+
   'th.k{background:#FBF6E6;color:#7A5E12;width:200px;font-weight:600}'+
   'tfoot td{border:none;padding-top:8px;font-size:8px;color:#8A7A55;text-align:center}';

  var body = kv
    ? '<table><tbody>'+rows.map(function(r){
        return '<tr><th class="k">'+esc(r[0])+'</th><td>'+esc(r[1]||'—').replace(/\n/g,'<br>')+'</td></tr>';
      }).join('')+'</tbody></table>'
    : '<table><thead><tr>'+headRow.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr>'+r.map(function(c){return '<td>'+esc(c==null?'':c).replace(/\n/g,'<br>')+'</td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table>';

  var when=fmtLocal(new Date().toISOString());
  var html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title>'+
    '<style>'+css+'</style></head><body>'+
    '<h1>'+esc(title)+'</h1>'+
    '<p class="sub">MSETCL — Load Trimming Scheme Register &nbsp;·&nbsp; Generated '+esc(when)+'</p>'+
    body+'</body></html>';

  var f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  var d=f.contentWindow.document;
  d.open(); d.write(html); d.close();
  f.onload=function(){
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('Print blocked by the browser','err'); }
    setTimeout(function(){ f.remove(); },1500);
  };
  /* srcdoc-less write() may not fire onload in some browsers */
  setTimeout(function(){ if(f.parentNode){ try{f.contentWindow.focus();f.contentWindow.print();}catch(e){} } },350);
}

/* =============================================================
   DATE-RANGE FILTER (Operations log exports)
============================================================= */
var OPRANGE={mode:'all',from:'',to:''};

/* Indian financial year: 1 Apr → 31 Mar */
function fyBounds(d){
  d=d||new Date();
  var y=d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
  return {from:new Date(y,3,1), to:new Date(y+1,2,31,23,59,59), label:'FY '+y+'-'+String(y+1).slice(2)};
}
function opsInRange(ops){
  if(OPRANGE.mode==='all') return ops;
  var f,t;
  if(OPRANGE.mode==='fy'){ var b=fyBounds(); f=b.from; t=b.to; }
  else {
    f=OPRANGE.from?new Date(OPRANGE.from):new Date(0);
    t=OPRANGE.to?new Date(OPRANGE.to+'T23:59:59'):new Date(8640000000000000);
  }
  return ops.filter(function(o){ var d=new Date(o.interruptFrom); return d>=f && d<=t; });
}
function rangeLabel(){
  if(OPRANGE.mode==='fy') return fyBounds().label;
  if(OPRANGE.mode==='custom'){
    return (OPRANGE.from?fmtDate(OPRANGE.from):'start')+' → '+(OPRANGE.to?fmtDate(OPRANGE.to):'today');
  }
  return 'All time';
}
function setRange(m){
  OPRANGE.mode=m;
  var c=document.getElementById('rangeCustom');
  if(c) c.classList.toggle('hidden',m!=='custom');
  var lbl=document.getElementById('rangeLbl');
  if(lbl) lbl.textContent=rangeLabel();
  paintOps();
}
function setRangeDate(which,v){ OPRANGE[which]=v; var l=document.getElementById('rangeLbl'); if(l)l.textContent=rangeLabel(); paintOps(); }

function rangePickerHtml(){
  return '<div class="rangepick" onclick="event.stopPropagation()">'+
    '<div class="rlab">Date range — <b id="rangeLbl">'+rangeLabel()+'</b></div>'+
    '<div class="rbtns">'+
      '<button class="'+(OPRANGE.mode==='all'?'on':'')+'" onclick="setRange(\'all\')">All time</button>'+
      '<button class="'+(OPRANGE.mode==='fy'?'on':'')+'" onclick="setRange(\'fy\')">This FY</button>'+
      '<button class="'+(OPRANGE.mode==='custom'?'on':'')+'" onclick="setRange(\'custom\')">Custom</button>'+
    '</div>'+
    '<div id="rangeCustom" class="rcustom'+(OPRANGE.mode==='custom'?'':' hidden')+'">'+
      '<input type="date" class="in" value="'+esc(OPRANGE.from)+'" onchange="setRangeDate(\'from\',this.value)">'+
      '<input type="date" class="in" value="'+esc(OPRANGE.to)+'" onchange="setRangeDate(\'to\',this.value)">'+
    '</div><hr></div>';
}

/* =============================================================

function ltsOpsHistory(ltsId){
  busy(true);
  var need = (S.opsLoaded===S.sub && S.ops) ? Promise.resolve(S.ops)
    : api('apiGetOperations',S.token,S.sub).then(function(o){ S.ops=o; S.opsLoaded=S.sub; return o; });
  need.then(function(all){
    busy(false);
    var ops=all.filter(function(o){return o.ltsId===ltsId;})
      .sort(function(a,b){return new Date(b.interruptFrom)-new Date(a.interruptFrom);});
    var name=(CUR&&CUR.lts)?CUR.lts.tfIct:'';
    var body = ops.length
      ? '<div class="prevwrap"><table class="prev"><thead><tr>'+
          ['Operation','From','To','Duration','Logged by'].map(function(h){return '<th>'+h+'</th>';}).join('')+
        '</tr></thead><tbody>'+
        ops.map(function(o){
          return '<tr><td>'+esc(o.opTitle)+'</td><td>'+esc(fmtLocal(o.interruptFrom))+'</td>'+
            '<td>'+esc(fmtLocal(o.interruptTo))+'</td><td>'+fmtDur(o.durationMin)+'</td>'+
            '<td>'+esc(o.createdBy||'—')+'</td></tr>';
        }).join('')+'</tbody></table></div>'
      : '<div class="empty">This LTS has never been operated.</div>';

    LTSOPS={ltsId:ltsId,name:name,ops:ops};
    var foot = ops.length
      ? '<button class="btn sm" onclick="printLtsOps()">🖨 Print</button>'+
        '<button class="btn sm" onclick="exportLtsOps(\'xlsx\')">⬇ Excel</button>'+
        '<button class="btn sm" onclick="exportLtsOps(\'pdf\')">⬇ PDF</button>'+
        '<div style="flex:1"></div><button class="btn ghost" onclick="closeModal()">Close</button>'
      : '<div style="flex:1"></div><button class="btn ghost" onclick="closeModal()">Close</button>';
    openModal('Operation history — '+shorten(name,40)+' ('+ops.length+')',body,foot);
  }).catch(function(e){ busy(false); toast(e.message,'err'); });
}
var LTSOPS=null;

/* ISO -> value for <input type=datetime-local> (local time, no timezone) */
function dtLocal(iso){
  if(!iso) return '';
  var d=toDate(iso); if(!d) return '';
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function pickTestUpload(inp){
  var files=[].slice.call(inp.files||[]);
  if(!files.length) return;
  var nameEl=document.getElementById('tFileName');
  if(nameEl) nameEl.textContent='Uploading '+files.length+' file(s)…';
  files.reduce(function(chain,f){
    return chain.then(function(){
      return new Promise(function(res,rej){
        if(f.size>7*1024*1024){ toast(f.name+' is over 7 MB — skipped','err'); res(); return; }
        var r=new FileReader();
        r.onload=function(){
          var cap=prompt('Caption for '+f.name+':',f.name)||f.name;
          api('apiUploadTestingFile',S.token,S.sub,TDET.id,r.result.split(',')[1],f.name,f.type,cap)
            .then(function(){ res(); }).catch(function(e){ toast(e.message,'err'); res(); });
        };
        r.onerror=function(){ res(); };
        r.readAsDataURL(f);
      });
    });
  },Promise.resolve()).then(function(){
    if(nameEl) nameEl.textContent='';
    return api('apiGetTestingFiles',S.token,S.sub,TDET.id);
  }).then(function(files){ TDET.files=files; paintTestDetail(); toast('Attachment(s) added','ok'); });
}
function delTestUpload(id){

    TDET.files=TDET.files.filter(function(f){return f.id!==id;});
    paintTestDetail(); toast('Attachment removed','ok');
  }).catch(function(e){ toast(e.message,'err'); });
}

/* ---- Update LTS details: prefilled from the current version ---- */
var APPROVAL_FILE=null;
var VMODE='revise';   /* 'revise' = new version | 'edit' = correct in place */
function editLTSDetails(){ updateLTS('edit'); }
function updateLTS(mode){
  VMODE=mode||'revise';
  var editing=VMODE==='edit';
  var l=CUR.lts;
  APPROVAL_FILE=null;
  var cur=(CUR.versions||[])[0];
  var fields=LF.map(function(f){
    var full=(f[2]==='full'||f[2]==='area');
    var v=l[f[0]]||'';
    var input=f[2]==='area'
      ? '<textarea class="in" rows="3" id="u_'+f[0]+'">'+esc(v)+'</textarea>'
      : '<input class="in" id="u_'+f[0]+'" '+(f[2]==='num'?'type="number"':'')+' value="'+esc(v)+'">';
    return '<label class="fld'+(full?' full':'')+'"><span>'+f[1]+'</span>'+input+'</label>';
  }).join('');

  var cfRows=(CUR.customFields||[]).map(function(c,i){ return cfRowHtml(i,c.fieldName,c.fieldValue); }).join('');

  var body=
    (editing
      ? '<div class="notice">Correcting <b>version '+(cur?cur.versionNo:1)+'</b> in place. '+
        'Use this only to fix a data-entry mistake — it does <b>not</b> create a new version. '+
        'If the setting genuinely changed, cancel and use <b>Update LTS details</b> instead.</div>'
      : '<div class="notice">A revision creates <b>version '+((cur?cur.versionNo:0)+1)+'</b>. '+
        'The present setting stays in the history, closed off on the date you give below.</div>')+
    '<div class="form2">'+
      '<label class="fld"><span>'+(editing?'Functional from (w.e.f.)':'Functional from (w.e.f.) *')+
        '<span class="muted" style="font-weight:400;display:block;font-size:10.5px">Date the setting was commissioned / took effect</span></span>'+
        '<input class="in" type="date" id="u_from" value="'+esc(isoOf(editing&&cur?cur.functionalFrom:'')||todayISO())+'"></label>'+
      '<label class="fld"><span>Scheme end</span><select class="in" id="u_endType">'+
        '<option value="own"'+(l.endType!=='other'?' selected':'')+'>Own substation end</option>'+
        '<option value="other"'+(l.endType==='other'?' selected':'')+'>Other substation end</option></select></label>'+
      fields+
      '<label class="fld full"><span>Visible to viewers</span><select class="in" id="u_visibleToViewer">'+
        '<option value="yes"'+(String(l.visibleToViewer).toLowerCase()==='yes'?' selected':'')+'>Yes</option>'+
        '<option value="no"'+(String(l.visibleToViewer).toLowerCase()!=='yes'?' selected':'')+'>No</option></select></label>'+
    '</div>'+
    '<div class="panel" style="margin-top:14px"><h4>Custom fields</h4>'+
      '<div id="cfEdit">'+cfRows+'</div>'+
      '<button class="btn sm" onclick="addCfRow()">+ Add field</button></div>'+
    '<div class="panel" style="margin-top:14px"><h4>Approval'+(editing?'':' *')+'</h4>'+
      '<div class="form2">'+
        '<label class="fld"><span>LTS approval date'+
          '<span class="muted" style="font-weight:400;display:block;font-size:10.5px">Date the competent authority approved it</span></span>'+
          '<input class="in" type="date" id="u_apprDate" value="'+esc(isoOf(l.date))+'"></label>'+
      '</div>'+
      '<label class="fld"><span>Approval remarks'+(editing?'':' (required)')+'</span>'+
        '<textarea class="in" rows="3" id="u_remarks" placeholder="e.g. Revised per CE (Trans. Op.) letter no. … dated …">'+
        esc(editing&&cur?cur.approvalRemarks:'')+'</textarea></label>'+
      '<div style="margin-top:10px">'+
        '<input type="file" id="apprFile" class="hidden" multiple accept="image/*,application/pdf" onchange="pickApproval(this)">'+
        '<button class="btn" onclick="document.getElementById(\'apprFile\').click()">📎 Attach approval copies</button>'+
        '<span class="muted" id="apprName" style="margin-left:10px;font-size:12px">No file chosen</span>'+
      '</div></div>';

  var foot='<div style="flex:1"></div><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    (editing
      ? '<button class="btn primary" onclick="saveVersion()">Save correction</button>'
      : '<button class="btn primary" onclick="saveVersion()">Save as new version</button>');
  openModal((editing?'Edit LTS details — ':'Update LTS details — ')+shorten(l.tfIct,34),body,foot);
}
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
/* any stored date -> yyyy-mm-dd for <input type=date> */
function isoOf(v){
  var d=toDate(v); if(!d) return '';
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function cfRowHtml(i,n,v){
  return '<div class="cfrow" data-i="'+i+'">'+
    '<input class="in" placeholder="Field name" value="'+esc(n||'')+'">'+
    '<input class="in" placeholder="Value" value="'+esc(v||'')+'">'+
    '<button class="btn sm danger" onclick="this.parentNode.remove()">✕</button></div>';
}
function addCfRow(){
  var box=document.getElementById('cfEdit');
  box.insertAdjacentHTML('beforeend', cfRowHtml(box.children.length,'',''));
}
var APPROVAL_FILES=[];
function pickApproval(inp){
  var files=[].slice.call(inp.files||[]);
  if(!files.length) return;
  APPROVAL_FILES=[];
  var pending=files.length;
  files.forEach(function(f){
    if(f.size>7*1024*1024){ toast(f.name+' is over 7 MB — skipped','err'); if(!--pending) showAppr(); return; }
    var r=new FileReader();
    r.onload=function(){
      APPROVAL_FILES.push({base64:r.result.split(',')[1],mimeType:f.type,fileName:f.name});
      if(!--pending) showAppr();
    };
    r.readAsDataURL(f);
  });
}
function showAppr(){
  APPROVAL_FILE=APPROVAL_FILES[0]||null;   /* first one is the version's approval copy */
  var el=document.getElementById('apprName');
  if(el) el.textContent = APPROVAL_FILES.length
    ? APPROVAL_FILES.length+' file(s): '+APPROVAL_FILES.map(function(f){return f.fileName;}).join(', ')
    : 'No file chosen';
}

function saveVersion(){
  var editing=VMODE==='edit';
  var from=document.getElementById('u_from').value;
  var apprDate=document.getElementById('u_apprDate').value;
  var remarks=document.getElementById('u_remarks').value.trim();

  if(!editing){
    if(!from){ toast('"Functional from" date is required','err'); return; }
    if(!remarks){ toast('Approval remarks are required for a revision','err'); return; }
  }

  var fields={endType:document.getElementById('u_endType').value,
              visibleToViewer:document.getElementById('u_visibleToViewer').value};
  LF.forEach(function(f){ fields[f[0]]=document.getElementById('u_'+f[0]).value.trim(); });
  if(apprDate) fields.date=apprDate;      /* 'date' column = LTS approval date */

  var cfs=[];
  document.querySelectorAll('#cfEdit .cfrow').forEach(function(row){
    var ins=row.querySelectorAll('input');
    if(ins[0].value.trim()) cfs.push({fieldName:ins[0].value.trim(),fieldValue:ins[1].value.trim()});
  });

  busy(true);
  var done=function(msg){
    busy(false); closeModal();
    toast(msg,'ok');
    APPROVAL_FILE=null; APPROVAL_FILES=[];
    loadSub();
    openLTS(CUR.lts.id, editing?'d-spec':'d-versions');
  };

  if(editing){
    var obj={id:CUR.lts.id, customFields:cfs, functionalFrom:from||''};
    Object.keys(fields).forEach(function(k){ obj[k]=fields[k]; });
    api('apiSaveLTS',S.token,S.sub,obj)
      .then(function(){ return uploadApprovalExtras(0); })
      .then(function(){ done('LTS corrected'); })
      .catch(function(e){ busy(false); toast(e.message,'err'); });
    return;
  }

  api('apiSaveLTSVersion',S.token,S.sub,{
    ltsId:CUR.lts.id, functionalFrom:from, fields:fields, customFields:cfs,
    approvalRemarks:remarks, approval:APPROVAL_FILE
  }).then(function(r){
    /* extra approval copies become documents filed under the new version */
    return uploadApprovalExtras(1).then(function(){ return r; });
  }).then(function(r){
    done('Saved as version '+r.versionNo);
  }).catch(function(e){ busy(false); toast(e.message,'err'); });
}

/* upload APPROVAL_FILES[startIdx..] as normal attachments */
function uploadApprovalExtras(startIdx){
  var rest=APPROVAL_FILES.slice(startIdx);
  if(!rest.length) return Promise.resolve();
  return rest.reduce(function(chain,f){
    return chain.then(function(){
      return api('apiUploadFile',S.token,S.sub,CUR.lts.id,f.base64,f.fileName,f.mimeType,
                 'Approval copy — '+f.fileName);
    });
  },Promise.resolve());
}


/* =============================================================
   DIAGRAM BUILDER  — draw.io-style editor, EHV symbol palette
   Scene = { nodes:[{id,type,x,y,label,rot}], edges:[{a,b}] }
   Stored per-LTS as JSON in the Diagrams sheet.
============================================================= */
var DG={scene:null,sel:null,drag:null,connectFrom:null,undo:[],redo:[],grid:10,snap:true};

/* --- EHV symbol library. Each draws inside a 60x60 box centred at 0,0. --- */
var SYM={
  bus:      {n:'Busbar',      w:160,h:8,  draw:function(){return '<rect x="-80" y="-4" width="160" height="8" rx="2" class="s-bus"/>';}},
  cb:       {n:'Circuit breaker',w:26,h:26,draw:function(){return '<rect x="-13" y="-13" width="26" height="26" rx="2" class="s-cb"/>';}},
  iso:      {n:'Isolator',    w:30,h:24, draw:function(){return '<line x1="-15" y1="12" x2="12" y2="-12" class="s-ln"/><circle cx="-15" cy="12" r="3" class="s-dot"/><circle cx="15" cy="12" r="3" class="s-dot"/>';}},
  earth:    {n:'Earth switch',w:26,h:26, draw:function(){return '<line x1="0" y1="-13" x2="0" y2="4" class="s-ln"/><line x1="-9" y1="6" x2="9" y2="6" class="s-ln"/><line x1="-6" y1="10" x2="6" y2="10" class="s-ln"/><line x1="-3" y1="14" x2="3" y2="14" class="s-ln"/>';}},
  ct:       {n:'Current transformer',w:24,h:24,draw:function(){return '<circle cx="0" cy="0" r="10" class="s-ci"/><line x1="0" y1="-16" x2="0" y2="16" class="s-ln"/>';}},
  pt:       {n:'Voltage transformer',w:26,h:26,draw:function(){return '<circle cx="-5" cy="0" r="8" class="s-ci"/><circle cx="5" cy="0" r="8" class="s-ci"/>';}},
  la:       {n:'Lightning arrester',w:22,h:30,draw:function(){return '<rect x="-7" y="-12" width="14" height="20" rx="2" class="s-cb"/><line x1="0" y1="8" x2="0" y2="16" class="s-ln"/><line x1="-6" y1="16" x2="6" y2="16" class="s-ln"/>';}},
  ict:      {n:'ICT / Transformer',w:44,h:56,draw:function(){return '<circle cx="0" cy="-11" r="15" class="s-ci"/><circle cx="0" cy="11" r="15" class="s-ci"/>';}},
  ict3:     {n:'3-winding ICT',w:48,h:64,draw:function(){return '<circle cx="0" cy="-14" r="14" class="s-ci"/><circle cx="-10" cy="10" r="14" class="s-ci"/><circle cx="10" cy="10" r="14" class="s-ci"/>';}},
  relay:    {n:'Relay',       w:74,h:28, draw:function(){return '<rect x="-37" y="-14" width="74" height="28" rx="4" class="s-rl"/>';}},
  plcc:     {n:'PLCC / Carrier',w:84,h:28,draw:function(){return '<rect x="-42" y="-14" width="84" height="28" rx="4" class="s-pl"/>';}},
  source:   {n:'Grid source', w:30,h:30, draw:function(){return '<circle cx="0" cy="0" r="14" class="s-src"/><path d="M-6 4 L0 -6 L2 0 L7 -4" class="s-ln" fill="none"/>';}},
  load:     {n:'Feeder / load',w:26,h:26,draw:function(){return '<path d="M0,-13 L11,7 L-11,7 Z" class="s-ci"/>';}},
  cap:      {n:'Capacitor bank',w:26,h:26,draw:function(){return '<line x1="-11" y1="-4" x2="11" y2="-4" class="s-ln"/><line x1="-11" y1="4" x2="11" y2="4" class="s-ln"/><line x1="0" y1="-14" x2="0" y2="-4" class="s-ln"/><line x1="0" y1="4" x2="0" y2="14" class="s-ln"/>';}},
  reactor:  {n:'Reactor',     w:30,h:24, draw:function(){return '<path d="M-14 8 a7 7 0 0 1 14 0 a7 7 0 0 1 14 0" class="s-ln" fill="none"/>';}},
  text:     {n:'Text label',  w:10,h:10, draw:function(){return '';}}
};
var SYM_ORDER=['source','bus','cb','iso','earth','ct','pt','la','ict','ict3','reactor','cap','load','relay','plcc','text'];

function newScene(){ return {nodes:[],edges:[],w:1000,h:520}; }
function dgId(){ return 'n'+Math.random().toString(36).slice(2,9); }

function pushUndo(){
  DG.undo.push(JSON.stringify(DG.scene));
  if(DG.undo.length>60) DG.undo.shift();
  DG.redo=[];
  refreshUndoBtns();
}
function dgUndo(){ if(!DG.undo.length)return; DG.redo.push(JSON.stringify(DG.scene));
  DG.scene=JSON.parse(DG.undo.pop()); paintBuilder(); refreshUndoBtns(); }
function dgRedo(){ if(!DG.redo.length)return; DG.undo.push(JSON.stringify(DG.scene));
  DG.scene=JSON.parse(DG.redo.pop()); paintBuilder(); refreshUndoBtns(); }
function refreshUndoBtns(){
  var u=document.getElementById('bUndo'), r=document.getElementById('bRedo');
  if(u) u.disabled=!DG.undo.length;
  if(r) r.disabled=!DG.redo.length;
}

/* ---- render a scene to SVG (used by both the editor and read-only view) ---- */
function renderScene(sc,editable){
  var nodes=sc.nodes.map(function(n){
    var sym=SYM[n.type]||SYM.text;
    var inner = n.type==='text' ? '' : sym.draw();
    var lab = n.label ? '<text class="s-lab" x="0" y="'+(n.type==='text'?4:(sym.h/2+15))+'">'+esc(n.label)+'</text>' : '';
    var note=(n.note||'').trim();
    return '<g class="node'+(editable&&DG.sel===n.id?' sel':'')+(note?' hasnote':'')+'" data-id="'+n.id+'" '+
      (note?'onclick="showNodeNote(event,\''+n.id+'\')" ':'')+
      'transform="translate('+n.x+','+n.y+') rotate('+(n.rot||0)+')">'+
      (note?'<title>'+esc(note)+'</title>':'')+
      (editable?'<rect class="hit" x="'+(-sym.w/2-8)+'" y="'+(-sym.h/2-8)+'" width="'+(sym.w+16)+'" height="'+(sym.h+16)+'"/>':'')+
      (!editable&&note?'<rect class="hit nhit" x="'+(-sym.w/2-8)+'" y="'+(-sym.h/2-8)+'" width="'+(sym.w+16)+'" height="'+(sym.h+16)+'"/>':'')+
      inner+lab+
      (note?'<circle class="notedot" cx="'+(sym.w/2+5)+'" cy="'+(-sym.h/2-5)+'" r="4"/>':'')+
      '</g>';
  }).join('');
  var byId={}; sc.nodes.forEach(function(n){byId[n.id]=n;});
  var edges=(sc.edges||[]).map(function(e){
    var a=byId[e.a],b=byId[e.b]; if(!a||!b) return '';
    return '<line class="s-wire" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>';
  }).join('');
  return '<svg id="sld" class="scene" viewBox="0 0 '+(sc.w||1000)+' '+(sc.h||520)+'" style="width:100%;height:auto;display:block">'+
    (editable?'<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">'+
      '<path d="M20 0 L0 0 0 20" fill="none" stroke="var(--gridline)" stroke-width="1"/></pattern></defs>'+
      '<rect width="100%" height="100%" fill="url(#grid)"/>':'')+
    edges+nodes+'</svg>';
}

/* ---- the builder overlay ---- */
function openBuilder(){
  if(!DG.scene) DG.scene=seedFromAuto(ltsModel(CUR.lts));
  DG.undo=[]; DG.redo=[]; DG.sel=null; DG.connectFrom=null;

  document.getElementById('viewerMount').innerHTML=
   '<div id="viewer" class="builder">'+
     '<div class="vtop">'+
       '<button class="btn sm ghost" onclick="closeBuilder()">‹ Back</button>'+
       '<span class="name">Diagram builder — '+esc(shorten(CUR.lts.tfIct,40))+'</span>'+
       '<button class="btn sm" id="bUndo" onclick="dgUndo()" title="Undo (Ctrl+Z)">↶</button>'+
       '<button class="btn sm" id="bRedo" onclick="dgRedo()" title="Redo (Ctrl+Y)">↷</button>'+
       '<button class="btn sm" onclick="toggleSnap(this)" id="bSnap">Snap: on</button>'+
       '<button class="btn sm" onclick="exportSceneSvg()">⬇ SVG</button>'+
       '<button class="btn sm" onclick="exportScenePng()">⬇ PNG</button>'+
       '<button class="btn sm danger" onclick="clearScene()">Clear</button>'+
       '<button class="btn sm primary" onclick="saveScene()">Save diagram</button>'+
       '<button class="x" onclick="closeBuilder()">✕</button>'+
     '</div>'+
     '<div class="bwrap">'+
       '<aside class="palette">'+
         '<h5>EHV symbols</h5>'+
         '<p class="phint">Click to add, then drag to place.</p>'+
         SYM_ORDER.map(function(k){
           return '<button class="pitem" onclick="addNode(\''+k+'\')" title="'+esc(SYM[k].n)+'">'+
             '<svg viewBox="-45 -35 90 70">'+(k==='text'?'<text class="s-lab" x="0" y="5">Abc</text>':SYM[k].draw())+'</svg>'+
             '<span>'+esc(SYM[k].n)+'</span></button>';
         }).join('')+
       '</aside>'+
       '<div class="canvaswrap" id="canvasWrap"></div>'+
       '<aside class="inspector" id="inspector"></aside>'+
     '</div>'+
     '<div class="bhint">Drag to move · click a symbol then <b>C</b> + click another to connect · <b>R</b> rotate · <b>Del</b> delete · <b>Esc</b> deselect</div>'+
   '</div>';

  paintBuilder();
  document.addEventListener('keydown',builderKeys);
}
function closeBuilder(){
  document.removeEventListener('keydown',builderKeys);
  document.getElementById('viewerMount').innerHTML='';
  renderLtsDiagram();
}

/* start from the auto-generated layout so nobody draws from a blank page */
function seedFromAuto(m){
  var sc=newScene(), y=90;
  var src=addTo(sc,'source',90,60,m.kvHigh?m.kvHigh+' kV grid':'Source');
  var cb1=addTo(sc,'cb',90,140,'CB');
  var plant=addTo(sc,m.kind==='ict'?'ict3':'cb',90,230,shorten(m.plant,22));
  var ct=addTo(sc,'ct',90,310,m.ctr?'CT '+m.ctr:'CT');
  var rly=addTo(sc,'relay',250,310,shorten(m.relay,18)||'Relay');
  var bus=addTo(sc,'bus',300,390,(m.kvMid?m.kvMid+' kV':'LV')+' bus');
  sc.edges.push({a:src,b:cb1},{a:cb1,b:plant},{a:plant,b:ct},{a:ct,b:rly},{a:ct,b:bus});
  var fx=520;
  m.feeders.slice(0,5).forEach(function(f,i){
    var fy=150+i*70;
    var c=addTo(sc,'cb',fx,fy,'');
    var ld=addTo(sc,'load',fx+90,fy,shorten(f,20));
    sc.edges.push({a:bus,b:c},{a:c,b:ld});
  });
  if(m.plcc){ var p=addTo(sc,'plcc',250,240,'PLCC'); sc.edges.push({a:rly,b:p}); }
  return sc;
}
function addTo(sc,type,x,y,label){ var id=dgId(); sc.nodes.push({id:id,type:type,x:x,y:y,label:label||'',rot:0}); return id; }

function paintBuilder(){
  var wrap=document.getElementById('canvasWrap'); if(!wrap) return;
  wrap.innerHTML=renderScene(DG.scene,true);
  var svg=wrap.querySelector('svg');
  bindCanvas(svg);
  paintInspector();
  refreshUndoBtns();
}

function svgPoint(svg,ev){
  var pt=svg.createSVGPoint();
  var t=ev.touches?ev.touches[0]:ev;
  pt.x=t.clientX; pt.y=t.clientY;
  var m=svg.getScreenCTM().inverse();
  return pt.matrixTransform(m);
}
function snap(v){ return DG.snap? Math.round(v/DG.grid)*DG.grid : Math.round(v); }

function bindCanvas(svg){
  svg.addEventListener('mousedown',onDown);
  svg.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onUp);
  window.addEventListener('touchend',onUp);

  function onDown(ev){
    var g=ev.target.closest('.node');
    if(!g){ DG.sel=null; DG.connectFrom=null; paintBuilder(); return; }
    var id=g.dataset.id;
    if(DG.connectFrom && DG.connectFrom!==id){
      pushUndo();
      DG.scene.edges.push({a:DG.connectFrom,b:id});
      DG.connectFrom=null; DG.sel=id; paintBuilder();
      toast('Connected','ok');
      return;
    }
    DG.sel=id;
    var n=DG.scene.nodes.filter(function(x){return x.id===id;})[0];
    var p=svgPoint(svg,ev);
    DG.drag={id:id,dx:p.x-n.x,dy:p.y-n.y,moved:false};
    ev.preventDefault();
    paintBuilder();
  }
  function onMove(ev){
    if(!DG.drag) return;
    ev.preventDefault();
    if(!DG.drag.moved){ pushUndo(); DG.drag.moved=true; }
    var p=svgPoint(svg,ev);
    var n=DG.scene.nodes.filter(function(x){return x.id===DG.drag.id;})[0];
    if(!n) return;
    n.x=snap(p.x-DG.drag.dx); n.y=snap(p.y-DG.drag.dy);
    var g=svg.querySelector('.node[data-id="'+n.id+'"]');
    if(g) g.setAttribute('transform','translate('+n.x+','+n.y+') rotate('+(n.rot||0)+')');
    redrawWires(svg);
  }
  function onUp(){ if(DG.drag && DG.drag.moved) paintInspector(); DG.drag=null; }
}
function redrawWires(svg){
  var byId={}; DG.scene.nodes.forEach(function(n){byId[n.id]=n;});
  svg.querySelectorAll('.s-wire').forEach(function(w,i){
    var e=DG.scene.edges[i]; if(!e) return;
    var a=byId[e.a],b=byId[e.b]; if(!a||!b) return;
    w.setAttribute('x1',a.x); w.setAttribute('y1',a.y);
    w.setAttribute('x2',b.x); w.setAttribute('y2',b.y);
  });
}

function addNode(type){
  pushUndo();
  var id=addTo(DG.scene,type,snap(120+Math.random()*80),snap(80+Math.random()*80),
    type==='text'?'Label':'');
  DG.sel=id; paintBuilder();
}
function paintInspector(){
  var box=document.getElementById('inspector'); if(!box) return;
  var n=DG.scene.nodes.filter(function(x){return x.id===DG.sel;})[0];
  if(!n){ box.innerHTML='<h5>Properties</h5><p class="phint">Select a symbol to edit it.</p>'+
    '<h5 style="margin-top:16px">Canvas</h5>'+
    '<label class="fld"><span>Width</span><input class="in" type="number" value="'+(DG.scene.w||1000)+'" onchange="DG.scene.w=+this.value;paintBuilder()"></label>'+
    '<label class="fld"><span>Height</span><input class="in" type="number" value="'+(DG.scene.h||520)+'" onchange="DG.scene.h=+this.value;paintBuilder()"></label>'; return; }
  box.innerHTML='<h5>'+esc(SYM[n.type]?SYM[n.type].n:n.type)+'</h5>'+
    '<label class="fld"><span>Label</span><input class="in" id="pLab" value="'+esc(n.label||'')+'" oninput="setNode(\'label\',this.value)"></label>'+
    '<div class="form2">'+
      '<label class="fld"><span>X</span><input class="in" type="number" value="'+n.x+'" oninput="setNode(\'x\',+this.value)"></label>'+
      '<label class="fld"><span>Y</span><input class="in" type="number" value="'+n.y+'" oninput="setNode(\'y\',+this.value)"></label>'+
    '</div>'+
    '<label class="fld"><span>Rotation °</span><input class="in" type="number" step="15" value="'+(n.rot||0)+'" oninput="setNode(\'rot\',+this.value)"></label>'+
    '<label class="fld"><span>Hidden note <span class="muted" style="font-weight:400">(shown on hover / click)</span></span>'+
      '<textarea class="in" rows="3" placeholder="e.g. CB 4052, SF6, 40 kA, last CRM 12-Jan-2026" '+
      'oninput="setNode(\'note\',this.value)">'+esc(n.note||'')+'</textarea></label>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+
      '<button class="btn sm" onclick="startConnect()">'+(DG.connectFrom?'Click target…':'⇢ Connect')+'</button>'+
      '<button class="btn sm" onclick="rotateSel()">↻ Rotate</button>'+
      '<button class="btn sm danger" onclick="delNode()">Delete</button>'+
    '</div>'+
    '<h5 style="margin-top:16px">Wires</h5>'+
    (DG.scene.edges.filter(function(e){return e.a===n.id||e.b===n.id;}).length
      ? '<button class="btn sm ghost" onclick="clearWires()">Remove this symbol\'s wires</button>'
      : '<p class="phint">Not connected.</p>');
}
function setNode(k,v){
  var n=DG.scene.nodes.filter(function(x){return x.id===DG.sel;})[0]; if(!n)return;
  n[k]=v;
  var svg=document.querySelector('#canvasWrap svg');
  if(k==='label'||k==='note'){ paintBuilder(); return; }
  var g=svg&&svg.querySelector('.node[data-id="'+n.id+'"]');
  if(g) g.setAttribute('transform','translate('+n.x+','+n.y+') rotate('+(n.rot||0)+')');
  if(svg) redrawWires(svg);
}
function startConnect(){ DG.connectFrom=DG.sel; paintInspector(); toast('Now click the symbol to connect to','ok'); }
function rotateSel(){ var n=DG.scene.nodes.filter(function(x){return x.id===DG.sel;})[0]; if(!n)return;
  pushUndo(); n.rot=((n.rot||0)+90)%360; paintBuilder(); }
function delNode(){
  if(!DG.sel) return;
  pushUndo();
  DG.scene.nodes=DG.scene.nodes.filter(function(n){return n.id!==DG.sel;});
  DG.scene.edges=DG.scene.edges.filter(function(e){return e.a!==DG.sel&&e.b!==DG.sel;});
  DG.sel=null; paintBuilder();
}
function clearWires(){
  pushUndo();
  DG.scene.edges=DG.scene.edges.filter(function(e){return e.a!==DG.sel&&e.b!==DG.sel;});
  paintBuilder();
}
function clearScene(){ if(!confirm('Clear the whole diagram?'))return; pushUndo(); DG.scene=newScene(); DG.sel=null; paintBuilder(); }
function toggleSnap(btn){ DG.snap=!DG.snap; btn.textContent='Snap: '+(DG.snap?'on':'off'); }

function builderKeys(e){
  if(/input|textarea/i.test(e.target.tagName)) return;
  if(e.key==='Escape'){ DG.sel=null; DG.connectFrom=null; paintBuilder(); }
  else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delNode(); }
  else if(e.key==='r'||e.key==='R'){ rotateSel(); }
  else if(e.key==='c'||e.key==='C'){ startConnect(); }
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); dgUndo(); }
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='Z'))){ e.preventDefault(); dgRedo(); }
}

function saveScene(){
  busy(true);
  var payload=JSON.parse(JSON.stringify(DG.scene));
  payload.cards=(DGCARDS||[]).map(function(c){ var o={}; for(var k in c) if(k!=='__lts') o[k]=c[k]; return o; });
  api('apiSaveDiagram',S.token,S.sub,CUR.lts.id,payload).then(function(){
    busy(false); toast('Diagram saved','ok'); closeBuilder();
  }).catch(function(e){ busy(false); toast(e.message,'err'); });
}

/* ---- export the drawing ---- */
function sceneSvgString(){
  /* Exports are for documents & printing: white paper, ink symbols.
     Literal colours only — CSS variables do not resolve in a standalone SVG. */
  var css='<style>'+
    '.s-bus{fill:#0d5f80}'+
    '.s-cb{fill:#ffffff;stroke:#0d5f80;stroke-width:2}'+
    '.s-ln{stroke:#0d5f80;stroke-width:2;fill:none}'+
    '.s-dot{fill:#0d5f80}'+
    '.s-ci{fill:none;stroke:#0d5f80;stroke-width:2}'+
    '.s-rl{fill:#fdf7e6;stroke:#b8912f;stroke-width:2}'+
    '.s-pl{fill:#eefaf2;stroke:#1f9d61;stroke-width:2}'+
    '.s-src{fill:none;stroke:#b8912f;stroke-width:2}'+
    '.s-wire{stroke:#5b6a7d;stroke-width:2}'+
    '.s-lab{fill:#20293a;font:11px Inter,Calibri,sans-serif;text-anchor:middle}'+
    '</style>';
  var body=renderScene(DG.scene,false)
    .replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
  return body.replace(/^(<svg[^>]*>)/, '$1' + css + '<rect width="100%" height="100%" fill="#ffffff"/>');
}
function diagramFileName(ext){
  return String(CUR.lts.tfIct||'diagram').replace(/[^\w\s-]/g,'').replace(/\s+/g,'_').slice(0,60)+'_SLD.'+ext;
}
function exportSceneSvg(){
  saveBlob(new Blob([sceneSvgString()],{type:'image/svg+xml'}), diagramFileName('svg'));
}
function exportScenePng(){
  var svg=sceneSvgString();
  var img=new Image();
  var url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=function(){
    var sc=2, c=document.createElement('canvas');
    c.width=(DG.scene.w||1000)*sc; c.height=(DG.scene.h||520)*sc;
    var g=c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(function(b){ saveBlob(b, diagramFileName('png')); },'image/png');
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast('PNG export failed — use SVG','err'); };
  img.src=url;
}

/* ---- hardware / browser Back closes the topmost overlay ----
   Each overlay pushes a history entry; Back pops it instead of leaving. */
(function(){
  function overlayOpen(){
    return !!document.getElementById('viewer') || !!document.getElementById('modalMount').firstChild;
  }
  var pushed=0;
  function sync(){
    if(overlayOpen() && pushed===0){ history.pushState({lts:1},''); pushed=1; }
  }
  /* observe overlay mounts */
  ['viewerMount','modalMount'].forEach(function(id){
    new MutationObserver(sync).observe(document.getElementById(id),{childList:true});
  });
  window.addEventListener('popstate',function(){
    pushed=0;
    if(document.getElementById('viewer')) closeViewer();
    else if(document.getElementById('modalMount').firstChild) closeModal();
    else if(S.tab==='lts') go('home');       /* Back leaves the LTS page */
  });
  /* opening an LTS page also pushes a history entry */
  window.addEventListener('lts:open',function(){ history.pushState({lts:1},''); });
})();

/* ---- global styling for the modal Back button ---- */
/* init: initial conductor colours once sim view exists is handled by tick */
(function(){ var b=document.getElementById('buildTag'); if(b) b.textContent=BUILD; applyTheme(THEME); })();
