<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSETCL LTS Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ================= THEME TOKENS =================
   Night: deep indigo, copper + teal. Day: warm paper, brass + slate.
   Every surface reads from these, so the toggle is instant. */
:root,[data-theme="night"]{
  --bg:#0b1220; --bg2:#101a2c;
  --panel:#141f33; --panel2:#1a2740; --line:#26384f; --line2:#33506f;
  --ink:#e9eff8; --muted:#8ba3c0;
  --accent:#48cfe0; --acc:#48cfe0; --accent-dim:#1c6f86;
  --gold:#e9b949; --copper:#e0913c;
  --live:#3fd08a; --alarm:#f4b740; --trip:#ff6b6b;
  --glow:rgba(72,207,224,.20);
  --shadow:0 14px 40px rgba(0,0,0,.45);
  --grid-line:rgba(255,255,255,.028);
  --r:14px; --mono:'IBM Plex Mono',ui-monospace,monospace; --ui:'Inter',system-ui,sans-serif;
  /* diagram / canvas / viewer surfaces */
  --vbg:#0f1319;            /* viewer + builder backdrop  */
  --canvas:#0d1826;         /* SLD canvas                 */
  --canvas2:#0b1622;        /* builder canvas             */
  --gridline:#16283a;       /* builder snap grid          */
  --wire:#40597a;           /* de-energised conductor     */
  --wire-dead:#33465c;
  --sym:#7fd6ff;            /* symbol stroke              */
  --symfill:#12283c;        /* symbol fill                */
  --symlab:#cfe0f0;         /* symbol label               */
  --eqfill:#12233a; --eqline:#3a5578;
}
[data-theme="day"]{
  --bg:#f4f1ea; --bg2:#ffffff;
  --panel:#ffffff; --panel2:#f7f4ec; --line:#e2dccd; --line2:#cfc6b0;
  --ink:#20293a; --muted:#6d7789;
  --accent:#0d7f96; --acc:#0d7f96; --accent-dim:#7fc4d2;
  --gold:#b8912f; --copper:#b06a24;
  --live:#1f9d61; --alarm:#c98a10; --trip:#c4453f;
  --glow:rgba(13,127,150,.14);
  --shadow:0 10px 30px rgba(40,50,70,.10);
  --grid-line:rgba(40,50,70,.05);
  /* day-mode diagram surfaces: paper-white canvas, ink-blue symbols */
  --vbg:#e9e6df;
  --canvas:#ffffff;
  --canvas2:#ffffff;
  --gridline:#e6e1d4;
  --wire:#8b98ab;
  --wire-dead:#b6bfcb;
  --sym:#0d5f80;
  --symfill:#eef6f9;
  --symlab:#243247;
  --eqfill:#eef6f9; --eqline:#0d5f80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{transition:background .35s ease}
body{color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 82% -12%, var(--glow) 0%, transparent 60%),
    linear-gradient(180deg,var(--bg2) 0%, var(--bg) 45%) fixed;
  transition:background .35s ease,color .25s ease}

/* faint substation grid, drawn behind everything */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 40%,transparent 100%);
}
#app,#login{position:relative;z-index:1}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3f59;border-radius:8px}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- buttons / inputs ---------- */
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:9px;
  padding:8px 13px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--accent);color:#fff}
.btn.primary{background:linear-gradient(180deg,#3ac2e6,#2597b6);border-color:#3ac2e6;color:#05202a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a2e2e;color:#ff9c9c}
.btn.danger:hover{background:#3a1c1c;border-color:var(--trip)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fld{display:block;margin:0 0 12px}
label.fld > span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;background:#0e1926;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:9px 11px;font-size:13px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,194,230,.14)}
textarea.in{resize:vertical}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;border:1px solid var(--line2)}
.pill.ok{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent);
  background:color-mix(in srgb,var(--live) 12%,transparent)}
.pill.warn{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 45%,transparent);
  background:color-mix(in srgb,var(--alarm) 12%,transparent)}
.pill.off{color:var(--muted)}
.pill.other{color:var(--copper);border-color:#6b4b26;background:#241a10}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:linear-gradient(180deg,rgba(24,39,58,.9),rgba(19,31,46,.95));
  border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.login-box{width:min(430px,94vw);padding:30px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.brand .spark{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#3ac2e6,#1c6f86);
  display:grid;place-items:center;box-shadow:0 0 22px rgba(58,194,230,.5)}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.tabsw{display:flex;background:#0e1926;border:1px solid var(--line);border-radius:11px;padding:4px;margin:20px 0}
.tabsw button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:8px;font-weight:600;font-size:13px}
.tabsw button.on{background:var(--panel2);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ---------- app shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
/* One sticky header — no magic offsets, fully opaque so page content
   can never bleed through while scrolling. */
.apphdr{position:sticky;top:0;z-index:60;background:var(--panel);
  box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.14)}
.topbar{position:relative;display:flex;align-items:center;gap:14px;padding:11px 18px;overflow:hidden;
  background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .grow{flex:1}
.subselect{display:flex;align-items:center;gap:8px;background:#0e1926;border:1px solid var(--line2);
  border-radius:10px;padding:4px 4px 4px 12px}
.subselect .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live)}
.subselect select{background:none;border:none;color:#fff;font-weight:700;font-size:13px;padding:5px}
.userchip{display:flex;align-items:center;gap:9px;font-size:12px}
.userchip .av{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);
  display:grid;place-items:center;font-weight:700;color:var(--accent)}
.nav{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);
  background:var(--panel);position:relative;z-index:1;overflow-x:auto}
.nav button{background:none;border:none;color:var(--muted);padding:10px 15px;font-weight:600;font-size:13px;
  border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:#fff;border-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px;width:100%}
.viewhd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.viewhd.nopad{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* ---------- outage / testing registers ---------- */
.regitem{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 14px;margin-bottom:10px}
.regitem.clickable{cursor:pointer;transition:border-color .14s,transform .12s}
.regitem.clickable:hover{border-color:var(--accent);transform:translateY(-1px)}
.rgtop{display:flex;align-items:center;gap:10px}
.rgacts{display:flex;gap:6px;flex-wrap:wrap}
.rgfield{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2)}
.rgfield b{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.rgfield p{margin:0;font-size:13px;line-height:1.5}
@media(max-width:640px){
  .rgtop{flex-wrap:wrap}
  .rgacts{width:100%}
  .rgacts .btn{flex:1 1 auto;justify-content:center}
}
.viewhd h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.viewhd p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- LTS cards ---------- */
.section-t{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.lts{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;position:relative;
  transition:.15s;overflow:hidden}
.lts::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.lts.uv::before{background:var(--alarm)}
.lts.line::before{background:var(--copper)}
.lts:hover{border-color:var(--line2);transform:translateY(-2px)}
.lts .no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.lts h3{margin:4px 0 8px;font-size:15px;font-weight:700;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:2px 0 10px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font-family:var(--mono);text-align:right}
.lts .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,11,18,.72);backdrop-filter:blur(4px);z-index:60;
  display:grid;place-items:center;padding:18px}
.modal{width:min(860px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.modal .mh{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:18px}
.x{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:32px;height:32px;font-size:16px}
.x:hover{color:#fff;border-color:var(--trip)}
.detail-tabs{display:flex;gap:4px;margin:-4px 0 16px;border-bottom:1px solid var(--line)}
.detail-tabs button{background:none;border:none;color:var(--muted);padding:9px 13px;font-weight:600;
  border-bottom:2px solid transparent}
.detail-tabs button.on{color:#fff;border-color:var(--accent)}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.spec td:first-child{color:var(--muted);width:190px;font-weight:500}
.spec td:last-child{font-family:var(--mono)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form2 .full{grid-column:1/-1}

/* ---------- uploads ---------- */
.uplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ucard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:.15s}
.ucard:hover{border-color:var(--accent)}
.uthumb{height:96px;background:#0e1926;display:grid;place-items:center;color:var(--muted);font-size:30px}
.ucap{padding:8px 10px;font-size:12px;border-top:1px solid var(--line)}
.ucap .fn{color:var(--muted);font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- viewer ---------- */
/* ---------- viewer / builder shell (full-screen overlay) ---------- */
#viewer{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  background:var(--vbg);animation:lbIn .18s ease-out}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
/* toolbar stays put no matter how far the document scrolls */
.vtop{flex:0 0 auto;position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:var(--panel)}
.vtop .name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:60px;color:var(--ink)}
.vtop .btn{flex:0 0 auto}
@media(max-width:760px){
  .vtop{flex-wrap:wrap;padding:8px 10px}
  .vtop .name{flex:1 1 100%;order:-1;font-size:13px}
  .vtop .btn{flex:1 1 auto;justify-content:center}
}

/* ---------- rich text ---------- */
.rtblock{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
.rttool{display:flex;gap:2px;align-items:center;background:var(--panel2);border-bottom:1px solid var(--line);padding:5px 6px;flex-wrap:wrap}
.rttool button{background:none;border:1px solid transparent;color:var(--muted);min-width:30px;height:28px;border-radius:6px;font-size:13px;cursor:pointer}
.rttool button:hover{color:#fff;background:#0e1926}
.rtsel{background:#0e1926;border:1px solid var(--line);color:var(--ink);border-radius:6px;height:28px;
  font-size:11.5px;padding:0 4px;max-width:88px;cursor:pointer}
.rtclr{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;
  border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}
.rtclr:hover{background:#0e1926}
.rtclr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0}
.rttool .lbl{flex:1 1 160px;min-width:120px}
.rttool input{background:#0e1926;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:12px;width:100%}
.rtedit{min-height:90px;padding:11px 13px;font-size:13px;outline:none;background:#0e1926}
.rtedit:empty::before{content:attr(data-ph);color:var(--muted)}
.rtread{background:#0e1926;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px}
.rtread h5{margin:0 0 4px;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em}

/* ---------- op log ---------- */
.oplog{display:flex;flex-direction:column}
.opitem .top b{font-size:14px}

/* ---------- admin ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;background:var(--panel2);color:var(--muted);padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tbl td{padding:9px 12px;border-top:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h4{margin:0 0 14px;font-size:15px}

/* ---------- diagram / animation ---------- */
.simwrap{background:var(--canvas);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.simbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:14px}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gauge .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gauge .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:3px;color:var(--ink)}
.gauge .val small{font-size:12px;color:var(--muted)}
svg .cond{stroke:var(--wire);stroke-width:3;fill:none}
svg .cond.live{stroke:var(--live)}
svg .cond.hot{stroke:var(--alarm)}
svg .cond.dead{stroke:var(--wire-dead);stroke-dasharray:5 6}
.flow{fill:var(--accent)}
.node-lab{fill:var(--muted);font:600 11px var(--ui)}
.node-val{fill:var(--symlab);font:600 12px var(--mono)}
.eq{fill:var(--eqfill);stroke:var(--eqline);stroke-width:1.5}
.bkr{fill:var(--symfill);stroke:var(--sym);stroke-width:1.5}
/* auto-diagram primitives (these had NO rule at all -> SVG defaulted to black) */
.wdg{fill:none;stroke:var(--sym);stroke-width:2}
.src{fill:none;stroke:var(--gold);stroke-width:2}
.ct{fill:none;stroke:var(--sym);stroke-width:2}
.bus{stroke:var(--sym);stroke-width:5;stroke-linecap:round}
.bus.live{stroke:var(--live)}
.bus.hot{stroke:var(--alarm)}
.bus.dead{stroke:var(--wire-dead)}
.fdr .dot{fill:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 14px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0e1926;border:1px solid var(--line2);
  color:var(--ink);padding:11px 18px;border-radius:11px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:120;font-size:13px;max-width:90vw}
.toast.err{border-color:var(--trip);color:#ffc9c9}
.toast.ok{border-color:#2c6b3f}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#loader{position:fixed;inset:0;display:grid;place-items:center;z-index:200;background:rgba(6,11,18,.4)}

/* ---------- LTS versions ---------- */
.updbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.updbar.bottom{margin:14px 0 0;border-top:1px solid var(--line);padding-top:14px}
.notice{background:#12283c;border:1px solid var(--line2);border-left:3px solid var(--acc);
  border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.vitem{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px;margin-bottom:12px}
.vitem.cur{border-color:var(--acc);box-shadow:0 0 0 1px rgba(58,194,230,.15)}
.vhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.vno{font-family:var(--mono);font-weight:700;color:var(--acc);font-size:14px}
.vmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px 14px;margin-top:10px}
.vmeta div{display:flex;flex-direction:column;gap:2px}
.vmeta b{color:var(--muted);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.vmeta span{font-family:var(--mono);font-size:12.5px}
.vrem{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}
.vrem b{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.vrem p{margin:4px 0 0;font-size:13px}
.vappr{margin-top:8px;font-size:12.5px}
.vappr a{color:var(--acc);cursor:pointer;text-decoration:underline}
.vacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.cfrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
@media(max-width:640px){
  .cfrow{grid-template-columns:1fr auto}
  .vacts .btn,.updbar .btn{flex:1 1 auto;justify-content:center}
}

/* ---------- diagram note ---------- */
.dgnote{padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}
.dgnote b{color:var(--ink)}

/* ---------- diagram builder ---------- */
#viewer.builder{background:var(--vbg)}
.bwrap{flex:1;display:grid;grid-template-columns:186px 1fr 240px;min-height:0}
.palette,.inspector{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
.inspector{border-right:none;border-left:1px solid var(--line)}
.palette h5,.inspector h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.phint{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.pitem{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:9px;padding:6px 8px;margin-bottom:6px;cursor:pointer;text-align:left;
  transition:border-color .14s,transform .12s}
.pitem:hover{border-color:var(--acc);transform:translateX(2px)}
.pitem svg{width:40px;height:30px;flex:0 0 40px}
.pitem span{font-size:11.5px}
.canvaswrap{overflow:auto;background:var(--canvas2);padding:16px;min-width:0}
.bhint{padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);
  font-size:11.5px;color:var(--muted);text-align:center}
.bhint b{color:var(--acc);font-family:var(--mono)}
@media(max-width:900px){
  .bwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .palette{display:flex;gap:6px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  .palette h5,.palette .phint{display:none}
  .pitem{flex:0 0 auto;width:auto;margin:0;flex-direction:column;gap:2px}
  .pitem span{font-size:9.5px;white-space:nowrap}
  .inspector{border-left:none;border-top:1px solid var(--line);max-height:36vh}
}

/* ---------- scene symbols ---------- */
.scene .node{cursor:move}
.scene .node .hit{fill:transparent}
.scene .node.sel .hit{fill:rgba(58,194,230,.10);stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3;rx:4}
.s-bus{fill:var(--sym)}
.s-cb{fill:var(--symfill);stroke:var(--sym);stroke-width:2}
.s-ln{stroke:var(--sym);stroke-width:2;fill:none}
.s-dot{fill:var(--sym)}
.s-ci{fill:none;stroke:var(--sym);stroke-width:2}
.s-rl{fill:var(--symfill);stroke:var(--gold);stroke-width:2}
.s-pl{fill:var(--symfill);stroke:var(--live);stroke-width:2}
.s-src{fill:none;stroke:var(--gold);stroke-width:2}
.s-wire{stroke:var(--wire);stroke-width:2}
.s-lab{fill:var(--symlab);font-size:11px;text-anchor:middle;font-family:Inter,sans-serif}

/* ---------- auto diagram extras ---------- */
.line-el{fill:var(--symfill);stroke:var(--sym);stroke-width:2}
.tiny{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.tiny.bold{fill:var(--symlab);font-weight:600}
.relay{fill:var(--symfill);stroke:var(--gold);stroke-width:1.5}
.relay.picked{fill:var(--alarm);stroke:var(--gold)}
.plcc{fill:var(--symfill);stroke:var(--live);stroke-width:1.5}
.trip{stroke:var(--wire-dead);stroke-width:1.5;stroke-dasharray:4 3}
.trip.hot{stroke:var(--alarm);stroke-width:2}
.lead{fill:var(--symlab);font-size:11px}


/* =================================================================
   AMBIENT ELECTRICAL MOTION
   A transmission line across the header: towers, conductor sag,
   and a charge travelling the span. Subtle, never noisy.
================================================================= */
.tline{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.5}
.tline svg{position:absolute;bottom:-2px;left:0;width:100%;height:64px}
.tl-cond{fill:none;stroke:var(--line2);stroke-width:1.2}
.tl-tower{stroke:var(--line2);stroke-width:1.2;fill:none}
.tl-spark{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent))}
.tl-spark{animation:tlrun 7s linear infinite}
@keyframes tlrun{from{transform:translateX(-40px)}to{transform:translateX(1200px)}}

/* the brand mark hums like an energised bay */
.spark{position:relative}
.spark::after{content:'';position:absolute;inset:-4px;border-radius:inherit;
  box-shadow:0 0 0 0 var(--glow);animation:hum 3.4s ease-out infinite}
@keyframes hum{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* live status dot = breathing bus */
.subselect .dot{animation:bus 2.6s ease-in-out infinite}
@keyframes bus{0%,100%{box-shadow:0 0 0 0 var(--live)}50%{box-shadow:0 0 0 4px transparent}}

/* card top edge energises on hover, like a conductor picking up */
.lts.clickable{position:relative;overflow:hidden}
.lts.clickable::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);transition:none}
.lts.clickable:hover::before{animation:energise .8s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes energise{to{left:100%}}

/* ICT winding rings that rotate slowly in empty states */
.empty{position:relative}

/* =================================================================
   EXPORT MENU
================================================================= */
.expwrap{position:relative;display:inline-flex}
.expmenu{position:absolute;top:calc(100% + 6px);right:0;min-width:210px;z-index:40;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);
  padding:6px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;
  transition:opacity .15s,transform .18s cubic-bezier(.2,.8,.25,1)}
.expwrap.open .expmenu{opacity:1;transform:none;pointer-events:auto}
.expitem{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  padding:9px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.expitem:hover{background:var(--panel2);color:var(--accent)}
.expmenu hr{border:none;border-top:1px solid var(--line);margin:6px 2px}
.rangepick{padding:8px 9px 2px}
.rangepick .rlab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.rangepick .rlab b{color:var(--accent);text-transform:none;letter-spacing:0;font-family:var(--mono)}
.rbtns{display:flex;gap:4px}
.rbtns button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:6px 4px;font-size:11.5px;font-weight:600;cursor:pointer}
.rbtns button.on{border-color:var(--accent);color:var(--accent);background:var(--glow)}
.rcustom{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.rcustom .in{padding:5px 7px;font-size:11.5px}

/* =================================================================
   LTS FULL PAGE
================================================================= */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb a{cursor:pointer;color:var(--accent);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.ltshd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.ltstitle h2{margin:0;font-size:21px;line-height:1.25}
.ltstitle p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.oplink{cursor:pointer;color:var(--accent);text-decoration:none;font-weight:600}
.oplink:hover{text-decoration:underline}
@media(max-width:640px){
  .ltshd{gap:10px}
  .ltstitle h2{font-size:17px}
  .ltshd .actions{width:100%}
}

/* =================================================================
   OPS CARD — two lines, dates always visible
================================================================= */
.oplines{flex:1;min-width:0}
.oplines .l1{display:flex;align-items:center;gap:8px}
.oplines .l1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oplines .l2{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
.oplines .when{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.oplines .arw{color:var(--line2);font-size:11px}
.oplines .dur{font-family:var(--mono);font-size:11.5px;background:var(--panel2);
  border:1px solid var(--line2);border-radius:6px;padding:1px 7px;color:var(--accent)}
@media(max-width:640px){
  .oplines .l2{gap:5px}
  .oplines .when{font-size:10.5px}
}

/* =================================================================
   VIEWER — Google-Drive style, continuous scroll
================================================================= */
.vstage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:block;padding:0;
  background:#2b3038;position:relative}
[data-theme="day"] .vstage{background:#8a8f96}
.vstage.hlmode{cursor:crosshair}
#vscroll{padding:20px 0 60px}
.pagecol{display:flex;flex-direction:column;align-items:center;gap:18px}
.pagewrap{position:relative;display:inline-block;line-height:0;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.pagewrap canvas,.pagewrap img{display:block;background:#fff;max-width:none}
#vscroll>.pagewrap{margin:0 auto}
.annlayer{position:absolute;inset:0;pointer-events:none}
.ann{position:absolute;border:2px solid #ffd54a;border-radius:3px;pointer-events:auto;
  transition:box-shadow .15s;animation:annIn .22s ease-out}
@keyframes annIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ann:hover{box-shadow:0 0 0 3px rgba(255,213,74,.25)}
.ann.draft{border-style:dashed;background:rgba(255,213,74,.18)}
.anndel{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;
  background:#c4453f;color:#fff;border:2px solid #fff;font-size:11px;line-height:1;cursor:pointer;
  display:none;padding:0}
.ann:hover .anndel{display:block}
.annnote{position:absolute;left:0;bottom:100%;margin-bottom:4px;background:#1b1f24;color:#fff;
  font-size:11px;padding:3px 7px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .15s;
  pointer-events:none}
.ann:hover .annnote{opacity:1}
.vhint{position:sticky;bottom:14px;left:0;right:0;margin:0 auto;width:max-content;max-width:92%;
  font-size:11px;color:#cfd8e3;background:rgba(12,18,28,.86);border:1px solid rgba(255,255,255,.12);
  border-radius:99px;padding:6px 14px;pointer-events:none;z-index:3}
.themebtn{font-size:15px;padding:6px 9px}
#vscroll{transition:transform .28s cubic-bezier(.2,.8,.25,1)}
#vscroll.rot90{padding:60px 0}
/* hidden-note affordances in the diagram */
.node.hasnote{cursor:help}
.notedot{fill:var(--gold);stroke:var(--panel);stroke-width:1.5}
.nhit{fill:transparent}
.nodenote{position:fixed;z-index:200;max-width:280px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;
  font-size:12.5px;animation:cardIn .16s ease-out}
.nodenote b{display:block;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.nodenote p{margin:0;line-height:1.5}
/* gauge cards */
.gauge{position:relative}
.gauge.live{border-color:var(--accent-dim)}
.gauge .src{font-size:10px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.gdel{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:6px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;font-size:11px;line-height:1;opacity:0;transition:.15s}
.gauge:hover .gdel{opacity:1}
.gdel:hover{background:var(--panel);color:var(--trip)}
.cardbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 14px 14px}
/* documents grouped by version */
.docgrp{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.docgh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--panel2);border-bottom:1px solid var(--line)}
.apprrow{padding:11px 13px;border-bottom:1px dashed var(--line);font-size:12.5px}
.apprrow b{color:var(--gold)}
.docgrp .uplist{padding:12px 13px}
/* collapsible admin sections */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.acch{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:none;
  padding:13px 15px;cursor:pointer;text-align:left;color:var(--ink)}
.acch:hover{background:var(--panel)}
.acch h4{margin:0;font-size:13.5px;font-weight:700;flex:1}
.acch .chev{color:var(--muted);font-size:11px;width:12px}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.accinner{min-height:0;overflow:hidden}
.acc.open .accb{grid-template-rows:1fr}
.acc.open .accinner{padding:14px 15px}
.topbar>*:not(.tline){position:relative;z-index:1}

/* ---------- modal back button ---------- */

.mback{flex:0 0 auto}
@media(max-width:640px){ .mback{order:-2} }

/* =================================================================
   MOTION — restrained, physical, GPU-friendly
================================================================= */
.overlay{animation:ovIn .16s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{animation:mdIn .24s cubic-bezier(.2,.8,.25,1)}
@keyframes mdIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:640px){
  .modal{animation:mdUp .26s cubic-bezier(.2,.8,.25,1)}
  @keyframes mdUp{from{transform:translateY(100%)}to{transform:none}}
}
/* cards enter with a short stagger */
.grid>.lts{animation:cardIn .34s cubic-bezier(.2,.8,.25,1) backwards}
.grid>.lts:nth-child(1){animation-delay:.02s}
.grid>.lts:nth-child(2){animation-delay:.06s}
.grid>.lts:nth-child(3){animation-delay:.10s}
.grid>.lts:nth-child(4){animation-delay:.14s}
.grid>.lts:nth-child(5){animation-delay:.18s}
.grid>.lts:nth-child(n+6){animation-delay:.20s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.opgroup{animation:cardIn .3s cubic-bezier(.2,.8,.25,1) backwards}

/* view switch */
#view-home,#view-ops,#view-sim,#view-admin,#view-account{animation:viewIn .22s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* buttons: subtle press + focus ring */
.btn{transition:transform .12s cubic-bezier(.2,.8,.25,1),background .15s,border-color .15s,box-shadow .15s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* toast slides up */
.toast{animation:tIn .26s cubic-bezier(.2,.8,.25,1)}
@keyframes tIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:640px){ @keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}} }

/* nav underline glide */
.nav button{position:relative}
.nav button::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--acc);
  transform:scaleX(0);transform-origin:center;transition:transform .22s cubic-bezier(.2,.8,.25,1);border-radius:2px}
.nav button.on::after{transform:scaleX(1)}

/* skeleton shimmer for loading states */
.skel{background:linear-gradient(90deg,var(--panel2) 25%,#16283a 37%,var(--panel2) 63%);
  background-size:400% 100%;animation:shim 1.3s ease infinite;border-radius:8px;height:12px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* honour the OS setting — motion off, no exceptions */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------- operations log ---------- */
.opgroup{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.opgh{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.opgh h4{margin:0;font-size:13.5px;font-weight:700}
.opitem{border-bottom:1px solid var(--line)}
.opitem:last-child{border-bottom:none}
.opitem .top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  transition:background .14s}
.opitem .top:hover{background:rgba(255,255,255,.03)}
.opitem .chev{color:var(--muted);font-size:11px;width:12px;transition:transform .18s}
.opitem .opwhen{font-size:12px}
.opitem .dur{font-family:var(--mono);font-size:12px;background:#12283c;border:1px solid var(--line2);
  border-radius:6px;padding:2px 8px;color:var(--acc)}
/* collapsed by default; grid-template-rows animates cleanly to auto height */
.opitem .opbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease;
  overflow:hidden;padding:0 14px}
.opitem .opinner{min-height:0;overflow:hidden}
.opitem.open .opbody{grid-template-rows:1fr;padding-bottom:14px}
.opmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px 14px;
  padding:10px 0 2px;border-top:1px dashed var(--line2);margin-top:2px}
.opmeta div{display:flex;flex-direction:column;gap:2px}
.opmeta b{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.opmeta span{font-family:var(--mono);font-size:12.5px}
.opacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;
  border-top:1px solid var(--line);padding-top:10px}
@media(max-width:640px){
  .opitem .opwhen{display:none}
  .opacts .btn{flex:1 1 auto;justify-content:center}
}

/* ---------- export preview ---------- */
.lts.clickable{cursor:pointer;transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,box-shadow .16s}
.lts.clickable:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.lts.clickable:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lts.clickable:active{transform:translateY(-1px)}
.opencue{font-size:12px;color:var(--muted);font-weight:600;transition:color .16s,transform .16s}
.lts.clickable:hover .opencue{color:var(--acc);transform:translateX(3px)}
.prevwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:#0e1926}
table.prev{border-collapse:collapse;font-size:12.5px;width:100%;min-width:max-content}
table.prev th,table.prev td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;
  max-width:320px;white-space:normal;word-break:break-word}
table.prev thead th{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;position:sticky;top:0;z-index:1}
table.prev tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
table.prev td{font-family:var(--mono);color:var(--ink)}
table.prev.pkv{min-width:0}
table.prev.pkv th{width:210px;background:var(--panel2);color:var(--muted);font-weight:500;font-family:var(--ui)}

/* =================================================================
   RESPONSIVE — phone / tablet / desktop
================================================================= */
/* fluid grids never overflow a narrow screen */
.grid{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.gauges{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
/* any wide table can scroll instead of blowing out the layout */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom))}

/* ---- tablet & below ---- */
@media(max-width:900px){
  .wrap{padding:16px 14px 60px}
  .modal{width:min(860px,100vw)}
}

/* ---- phone ---- */
@media(max-width:640px){
  .form2{grid-template-columns:1fr}
  .viewhd h2{font-size:19px}
  .viewhd{align-items:flex-start}
  .viewhd .actions{width:100%}
  .viewhd .actions .btn{flex:1 1 auto;justify-content:center}

  /* topbar collapses to two tidy rows */
  .topbar{flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  .topbar .grow{display:none}
  .topbar .brand h1{font-size:14px}
  .subselect{order:3;flex:1 1 100%}
  .subselect select{width:100%}
  .userchip{margin-left:auto}
  .userchip>div:last-child{display:none}   /* keep avatar, drop name/role text */

  /* nav becomes a swipeable strip */
  .nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;padding:6px 10px 0}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:10px 12px}

  /* modal goes edge-to-edge like a native sheet */
  .overlay{padding:0}
  .modal{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:none}
  .modal .mb{padding:14px}
  .modal .mh{padding:13px 14px;flex-wrap:wrap}
  .modal .mh h3{font-size:15px;flex:1 1 100%;order:-1}

  /* spec + preview readability */
  .spec td:first-child{width:120px}
  table.prev.pkv th{width:130px}
  table.prev th,table.prev td{max-width:220px;padding:7px 8px}

  /* stack the LTS card key/value pairs */
  .kv span{text-align:left}

  /* file viewer toolbar wraps, stage fills screen */
  .vtop{flex-wrap:wrap;padding:8px 10px}
  .vtop .name{flex:1 1 100%;order:-1;font-size:13px}
  .vstage{padding:10px}

  /* diagram: let it scroll sideways so labels stay legible */
  .simscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .simscroll #sld{min-width:720px}
  .simbar{padding:10px}
  .simbar .btn{flex:1 1 auto;justify-content:center}
  .legend{padding:0 12px 12px;gap:10px;font-size:11px}

  .rttool{flex-wrap:wrap}
  .rttool .lbl{flex:1 1 100%;order:-1;margin-bottom:4px}
  .toast{left:12px;right:12px;bottom:14px;transform:none;max-width:none;text-align:center}
}

/* iOS: 16px inputs stop Safari auto-zooming on focus */
@media(max-width:820px){
  input.in,select.in,textarea.in{font-size:16px}
  .btn{min-height:40px}          /* comfortable touch targets */
  .btn.sm{min-height:36px}
  .x{width:38px;height:38px}
}

/* very small phones */
@media(max-width:380px){
  .wrap{padding:14px 10px 60px}
  .lts{padding:13px}
  .viewhd h2{font-size:17px}
}

/* short landscape phones — don't let the modal header eat the screen */
@media(max-height:520px) and (orientation:landscape){
  .modal{height:100dvh;max-height:100dvh}
  .login{margin:10px auto}
}

@media(prefers-reduced-motion:reduce){.flow{display:none}}

<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card login-box">
    <div class="brand">
      <div class="spark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#05202a"/></svg></div>
      <div><h1>LTS Portal</h1><div class="sub">MSETCL · Load Trimming Schemes</div></div>
    </div>
    <div class="tabsw">
      <button id="tabSignin" class="on" onclick="authTab('signin')">Sign in</button>
      <button id="tabReg" onclick="authTab('register')">Register substation</button>
    </div>

    <div id="paneSignin">
      <label class="fld"><span>Username</span><input id="liUser" class="in" autocomplete="username"></label>
      <label class="fld"><span>Password</span><input id="liPass" class="in" type="password" autocomplete="current-password"></label>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()"><span id="liBtnT">Sign in</span></button>
      <p class="muted" style="font-size:12px;margin-top:14px">Default admin — <span class="mono">admin / admin@123</span></p>
    </div>

    <div id="paneReg" class="hidden">
      <div class="form2">
        <label class="fld"><span>Editor username</span><input id="rgUser" class="in"></label>
        <label class="fld"><span>Password</span><input id="rgPass" class="in" type="password"></label>
        <label class="fld"><span>Substation name</span><input id="rgSubName" class="in" placeholder="e.g. 220kV Baramati"></label>
        <label class="fld"><span>Substation code</span><input id="rgSubCode" class="in" placeholder="e.g. J123" style="text-transform:uppercase"></label>
      </div>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="doRegister()">Submit for approval</button>
      <p class="muted" style="font-size:12px;margin-top:12px">An admin approves your account &amp; substation before first login.</p>
    </div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="muted mono" style="font-size:11px">build <span id="buildTag">—</span></span>
      <div style="flex:1"></div>
      <button class="btn sm ghost" onclick="testBackend()">Test backend connection</button>
    </div>
    <div id="diag" class="muted mono hidden" style="font-size:11px;margin-top:10px;white-space:pre-wrap;word-break:break-all;background:#0e1926;border:1px solid var(--line);border-radius:8px;padding:10px"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="apphdr">
  <div class="topbar">
    <div class="tline" aria-hidden="true">
      <svg viewBox="0 0 1200 64" preserveAspectRatio="none">
        <path class="tl-cond" d="M0 30 Q 150 52 300 30 T 600 30 T 900 30 T 1200 30"/>
        <path class="tl-cond" d="M0 38 Q 150 62 300 38 T 600 38 T 900 38 T 1200 38"/>
        <g class="tl-tower"><path d="M300 64 L300 18 M288 26 L312 26 M292 18 L308 18 M300 18 L288 30 M300 18 L312 30"/></g>
        <g class="tl-tower"><path d="M900 64 L900 18 M888 26 L912 26 M892 18 L908 18 M900 18 L888 30 M900 18 L912 30"/></g>
        <circle class="tl-spark" cx="0" cy="30" r="2.4"/>
      </svg>
    </div>
    <div class="brand" style="margin:0">
      <div class="spark" style="width:30px;height:30px"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#05202a"/></svg></div>
      <div><h1 style="font-size:15px">LTS Portal</h1></div>
    </div>
    <div class="subselect">
      <span class="dot"></span>
      <select id="subSel" onchange="switchSub(this.value)"></select>
    </div>
    <div class="grow"></div>
    <button class="btn ghost sm themebtn" id="themeBtn" onclick="toggleTheme()" title="Switch day / night">🌙</button>
    <div class="userchip">
      <div class="av" id="uAv">?</div>
      <div><div id="uName" style="font-weight:700"></div><div class="muted" id="uRole" style="font-size:11px"></div></div>
    </div>
    <button class="btn ghost sm" onclick="logout()">Sign out</button>
  </div>
  <div class="nav" id="nav"></div>
  </header>

  <div class="wrap">
    <div id="view-home"></div>
    <div id="view-lts" class="hidden"></div>
    <div id="view-ops" class="hidden"></div>
    <div id="view-admin" class="hidden"></div>
    <div id="view-account" class="hidden"></div>
  </div>
</div>

<div id="modalMount"></div>
<div id="viewerMount"></div>
<div id="loader" class="hidden"><span class="spin" style="width:34px;height:34px;border-width:3px"></span></div>

<script>
/* =============================================================
   state + api plumbing
============================================================= */
var S = { token:null, user:null, subs:[], sub:null, canEdit:false, lists:{own:[],other:[]}, ops:[], tab:'home' };
/* ===== Backend (Google Apps Script Web App) =====
   Hosted frontend -> different origin -> we call doPost() over fetch().
   Content-Type text/plain keeps it a "simple request" (no CORS pre-flight),
   and the anonymous web app returns Access-Control-Allow-Origin:* itself. */
var BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwtFz8x3aP_xEQBRBXmk6I03nlGz3CjHahDJJifkWD2FpAyXJZ-aD3vF94BXWcmbTV_1A/exec';
var BUILD = 'v7-2026-07-09';
try{ console.log('%cLTS Portal build: '+BUILD,'color:#3ac2e6;font-weight:700'); console.log('Backend:',BACKEND_URL); }catch(e){}

function api(fn){
  var args=[].slice.call(arguments,1);
  return fetch(BACKEND_URL,{
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:args})
  }).then(function(r){ return r.text(); }).then(function(t){
    var j;
    try{ j=JSON.parse(t); }
    catch(e){ throw new Error('Unexpected backend response — check the deployment URL and that Web-app access is set to "Anyone".'); }
    if(!j || j.ok!==true){ throw new Error(j && j.error ? j.error : 'Request failed'); }
    return j.data;
  });
}
function busy(on){ document.getElementById('loader').classList.toggle('hidden',!on); }

/* ---- connection self-test (login screen) ---- */
function testBackend(){
  var d=document.getElementById('diag');
  d.classList.remove('hidden');
  d.textContent='Build : '+BUILD+'\nTarget: '+BACKEND_URL+'\n\nContacting backend…';
  var t0=Date.now();
  fetch(BACKEND_URL,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:'apiGetContext',args:['__ping__']})
  }).then(function(r){ return r.text().then(function(t){return {status:r.status,text:t};}); })
  .then(function(r){
    var ms=Date.now()-t0, out='Build : '+BUILD+'\nTarget: '+BACKEND_URL+'\n\nHTTP '+r.status+'  ('+ms+' ms)\n';
    try{
      var j=JSON.parse(r.text);
      out+='Response: valid JSON\nok='+j.ok+(j.error?'\nerror="'+j.error+'"':'');
      out+='\n\n✅ Backend reachable. CORS is working.';
      if(j.error && /not initialised/i.test(j.error)) out+='\n⚠ Run setup() once in Apps Script.';
      else if(j.ok===false) out+='\n(An "invalid session" error here is EXPECTED — it proves the call went through.)';
    }catch(e){
      out+='Response: NOT JSON — first 200 chars:\n'+r.text.slice(0,200);
      out+='\n\n❌ Set Web-app access to "Anyone" and redeploy as a New version.';
    }
    d.textContent=out;
  }).catch(function(e){
    d.textContent='Build : '+BUILD+'\nTarget: '+BACKEND_URL+
      '\n\n❌ Request blocked: '+e.message+
      '\n\nLikely causes:\n • Web-app access is not "Anyone"\n • Page opened via file:// (use a real host)\n • Wrong /exec URL';
  });
}
function toast(msg,type){
  var t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='.4s';setTimeout(function(){t.remove();},400);},3200);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* =============================================================
   auth
============================================================= */
function authTab(w){
  var s=w==='signin';
  document.getElementById('tabSignin').classList.toggle('on',s);
  document.getElementById('tabReg').classList.toggle('on',!s);
  document.getElementById('paneSignin').classList.toggle('hidden',!s);
  document.getElementById('paneReg').classList.toggle('hidden',s);
}
function doLogin(){
  var u=val('liUser'),p=val('liPass');
  if(!u||!p){toast('Enter username and password','err');return;}
  document.getElementById('liBtnT').innerHTML='<span class="spin"></span>';
  api('apiLogin',u,p).then(function(r){
    S.token=r.token; S.user=r.user; boot();
  }).catch(function(e){ toast(e.message,'err'); document.getElementById('liBtnT').textContent='Sign in'; });
}
function doRegister(){
  var u=val('rgUser'),p=val('rgPass'),n=val('rgSubName'),c=val('rgSubCode');
  if(!u||!p||!c){toast('Fill username, password and substation code','err');return;}
  busy(true);
  api('apiRegister',u,p,n,c).then(function(r){ busy(false); toast(r.message,'ok'); authTab('signin'); })
    .catch(function(e){ busy(false); toast(e.message,'err'); });
}
function logout(){ S={token:null,user:null,subs:[],sub:null,canEdit:false,lists:{own:[],other:[]},ops:[],tab:'home'};
  document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden');
  document.getElementById('liBtnT').textContent='Sign in'; }
function val(id){return document.getElementById(id).value.trim();}

/* =============================================================
   boot after login
============================================================= */
function boot(){
  busy(true);
  api('apiGetContext',S.token).then(function(ctx){
    busy(false);
    S.user=ctx.user; S.subs=ctx.substations;
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('uName').textContent=S.user.username;
    document.getElementById('uRole').textContent=S.user.role.toUpperCase()+(S.user.substationCode&&S.user.substationCode!=='*'?' · '+S.user.substationCode:'');
    document.getElementById('uAv').textContent=(S.user.username[0]||'?').toUpperCase();
    buildNav();
    var sel=document.getElementById('subSel');
    sel.innerHTML=S.subs.map(function(s){return '<option value="'+esc(s.code)+'">'+esc(s.name)+' ('+esc(s.code)+')</option>';}).join('');
    if(S.subs.length){ S.sub=S.subs[0].code; sel.value=S.sub; loadSub(); }
    else { document.getElementById('view-home').innerHTML='<div class="empty">No substation is available to your account yet. Ask an admin to grant access.</div>'; }
  }).catch(function(e){ busy(false); toast(e.message,'err'); if(/session/i.test(e.message)) logout(); });
}
function buildNav(){
  var tabs=[['home','Load Trimming Schemes'],['ops','Operations Log'],['account','Account']];
  if(S.user.role==='admin') tabs.splice(2,0,['admin','Admin']);
  document.getElementById('nav').innerHTML=tabs.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(t[0]===S.tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
}
var VIEWS=['home','lts','ops','admin','account'];
function showView(v){
  if(v!=='lts') stopSim();
  VIEWS.forEach(function(x){
    var el=document.getElementById('view-'+x);
    if(el) el.classList.toggle('hidden',x!==v);
  });
  /* 'lts' is a sub-page of home, so keep Home lit in the nav */
  var navTab = v==='lts' ? 'home' : v;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===navTab);});
  window.scrollTo({top:0,behavior:'instant'});
}
function go(tab){
  S.tab=tab;
  closeExportMenus();
  showView(tab);
  if(tab==='ops') renderOps();
  if(tab==='admin') renderAdmin();
  if(tab==='account') renderAccount();
}

/* =============================================================
   THEME — day / night
============================================================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = t==='day' ? '☀️' : '🌙';
  try{ THEME=t; }catch(e){}
}
var THEME='night';
function toggleTheme(){
  applyTheme(THEME==='night'?'day':'night');
  try{ localStorage.setItem('lts_theme',THEME); }catch(e){}
}
(function(){
  var t='night';
  try{ t=localStorage.getItem('lts_theme')||'night'; }catch(e){}
  if(t!=='day'&&t!=='night') t='night';
  THEME=t;
  document.documentElement.setAttribute('data-theme',t);
})();

/* =============================================================
   COLLAPSIBLE EXPORT MENU
   items = [[label, jsCall], ...]
============================================================= */
function exportMenu(id,items,extraHtml){
  return '<div class="expwrap" id="'+id+'">'+
    '<button class="btn sm" onclick="toggleExport(event,\''+id+'\')">⬇ Export ▾</button>'+
    '<div class="expmenu">'+
      (extraHtml||'')+
      items.map(function(it){
        return '<button class="expitem" onclick="closeExportMenus();'+it[1].replace(/"/g,'&quot;')+'">'+it[0]+'</button>';
      }).join('')+
    '</div></div>';
}
function toggleExport(ev,id){
  ev.stopPropagation();
  var w=document.getElementById(id);
  var wasOpen=w.classList.contains('open');
  closeExportMenus();
  if(!wasOpen) w.classList.add('open');
}
function closeExportMenus(){
  document.querySelectorAll('.expwrap.open').forEach(function(w){w.classList.remove('open');});
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.expwrap')) closeExportMenus();
});
function switchSub(code){ S.sub=code; S.opsLoaded=null; S.ops=null; loadSub(); if(S.tab==='ops') renderOps(); }

function loadSub(){
  busy(true);
  api('apiGetLTSList',S.token,S.sub).then(function(r){
    busy(false); S.canEdit=r.canEdit; S.lists={own:r.own,other:r.other}; renderHome();
  }).catch(function(e){ busy(false); toast(e.message,'err'); });
}

/* =============================================================
   HOME — LTS lists
============================================================= */
function subMeta(){ return S.subs.filter(function(s){return s.code===S.sub;})[0]||{name:S.sub,code:S.sub}; }
function ltsClass(l){ var t=(l.tfIct||'').toLowerCase(); if(t.indexOf('uv')>=0||t.indexOf('under')>=0) return 'uv'; if(t.indexOf('ckt')>=0||t.indexOf('line')>=0||t.indexOf('girwali')>=0) return 'line'; return ''; }

function renderHome(){
  var m=subMeta();
  var h='<div class="viewhd"><div><h2>Load Trimming Schemes</h2>'+
    '<p>'+esc(m.name)+' · '+esc(m.division||'')+' — '+(S.lists.own.length+S.lists.other.length)+' scheme(s)</p></div>'+
    '<div class="actions">'+
      exportMenu('homeExp',[
        ['Excel','exportIt(\'list\',\'xlsx\')'],
        ['PDF','exportIt(\'list\',\'pdf\')'],
        ['Print','printScope(\'list\')']
      ])+
      (S.canEdit?'<button class="btn primary sm" onclick="editLTS(null,\'own\')">+ Add LTS</button>':'')+
    '</div></div>';

  h+='<div class="section-t">Own substation end</div>';
  h+= S.lists.own.length? '<div class="grid">'+S.lists.own.map(ltsCard).join('')+'</div>'
    : '<div class="empty">No LTS recorded at this substation end.'+(S.canEdit?' <a onclick="editLTS(null,\'own\')">Add one</a>.':'')+'</div>';

  h+='<div class="section-t">Other substation end</div>';
  h+= S.lists.other.length? '<div class="grid">'+S.lists.other.map(ltsCard).join('')+'</div>'
    : '<div class="empty">No LTS at the other substation end.'+(S.canEdit?' <a onclick="editLTS(null,\'other\')">Add one</a>.':'')+'</div>';

  document.getElementById('view-home').innerHTML=h;
}
function ltsCard(l){
  var vis=String(l.visibleToViewer).toLowerCase()==='yes';
  return '<div class="lts clickable '+ltsClass(l)+'" role="button" tabindex="0" '+
      'onclick="openLTS(\''+l.id+'\')" '+
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openLTS(\''+l.id+'\')}">'+
    '<div class="no">LTS '+esc(l.srNo)+' · '+(l.endType==='other'?'<span class="pill other">OTHER END</span>':'<span class="pill off">OWN END</span>')+
      (S.canEdit&&!vis?'<span class="pill off" title="Hidden from viewers" style="margin-left:6px">🚫 hidden</span>':'')+'</div>'+
    '<h3>'+esc(l.tfIct)+'</h3>'+
    '<div class="kv">'+
      '<b>Relay</b><span>'+esc(shorten(l.relayType,26))+'</span>'+
      '<b>CTR</b><span>'+esc(l.ctr)+'</span>'+
      '<b>Stage-1</b><span>'+esc(shorten(l.stage1,26))+'</span>'+
      '<b>Load relief</b><span>'+esc(shorten(l.loadRelief,26))+'</span>'+
      '<b>Last operated</b><span>'+(l.lastOpDate?esc(fmtDate(l.lastOpDate)):'Never')+'</span>'+
    '</div>'+
    '<div class="foot">'+
      '<span class="pill '+(String(l.healthiness).toLowerCase()==='yes'?'ok':'warn')+'">'+(String(l.healthiness).toLowerCase()==='yes'?'Healthy':esc(l.healthiness||'?'))+'</span>'+
      '<span class="pill '+(l.status==='Approved'?'ok':'off')+'">'+esc(l.status||'—')+'</span>'+
      '<div style="flex:1"></div>'+
      '<span class="opencue">Open ›</span>'+
    '</div></div>';
}
function shorten(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}

function toggleVis(id,to){
  api('apiToggleVisible',S.token,S.sub,id,to).then(function(){
    toast(to?'LTS is now visible to viewers':'LTS hidden from viewers','ok');
    loadSub();
    if(CUR && CUR.lts && CUR.lts.id===id) openLTS(id,'d-access');
  }).catch(function(e){toast(e.message,'err');});
}

/* =============================================================
   LTS EDIT form
============================================================= */
var LF=[['srNo','Sr No','num'],['date','Date / proposed','txt'],['tfIct','ICT / Line / Scheme name','full'],
 ['hvLv','LTS on HV / LV side','txt'],['ctr','Connected CTR','txt'],['relayType','Type of relay','txt'],
 ['maxLoad','Max load recorded','txt'],['alarmPsm','Alarm (PSM) setting','txt'],
 ['stage1','Stage-1 (Trip) setting','txt'],['stage2','Stage-2 (Trip) setting','txt'],
 ['feeders','Feeders involved in scheme','area'],['loadRelief','Load relief (obtained / required)','txt'],
 ['remarks','Remarks / purpose of LTS','area'],['status','Approval status','txt'],
 ['healthiness','Healthiness (Yes/No)','txt']];

function editLTS(existing,endType){
  var l=existing||{endType:endType||'own',status:'Approved',healthiness:'Yes',visibleToViewer:'yes'};
  var fields=LF.map(function(f){
    var full=(f[2]==='full'||f[2]==='area');
    var input=f[2]==='area'
      ? '<textarea class="in" rows="3" id="f_'+f[0]+'">'+esc(l[f[0]]||'')+'</textarea>'
      : '<input class="in" id="f_'+f[0]+'" '+(f[2]==='num'?'type="number"':'')+' value="'+esc(l[f[0]]||'')+'">';
    return '<label class="fld'+(full?' full':'')+'"><span>'+f[1]+'</span>'+input+'</label>';
  }).join('');
  var body='<div class="form2">'+
    '<label class="fld full"><span>Scheme end</span><select class="in" id="f_endType">'+
      '<option value="own"'+(l.endType!=='other'?' selected':'')+'>Own substation end</option>'+
      '<option value="other"'+(l.endType==='other'?' selected':'')+'>Other substation end</option></select></label>'+
    fields+
    '<label class="fld full"><span>Visible to viewers</span><select class="in" id="f_visibleToViewer">'+
      '<option value="yes"'+(String(l.visibleToViewer).toLowerCase()!=='no'?' selected':'')+'>Yes — viewers can see this LTS</option>'+
      '<option value="no"'+(String(l.visibleToViewer).toLowerCase()==='no'?' selected':'')+'>No — hidden from viewers</option></select></label>'+
    '</div>';
  openModal((existing?'Edit LTS':'Add LTS'),body,
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn primary" onclick="saveLTS(\''+(existing?existing.id:'')+'\')">Save LTS</button>');
}
function saveLTS(id){
  var o={endType:document.getElementById('f_endType').value,visibleToViewer:document.getElementById('f_visibleToViewer').value,
    division:subMeta().division||'',substation:subMeta().name};
  LF.forEach(function(f){o[f[0]]=document.getElementById('f_'+f[0]).value;});
  if(id)o.id=id;
  if(!o.tfIct){toast('Enter the ICT / line / scheme name','err');return;}
  busy(true);
  api('apiSaveLTS',S.token,S.sub,o).then(function(){ busy(false); closeModal(); toast('LTS saved','ok'); loadSub(); })
    .catch(function(e){busy(false);toast(e.message,'err');});
}

/* =============================================================
   LTS DETAIL
============================================================= */
var CUR=null; // current detail {lts,customFields,uploads,canEdit}
function openLTS(id,tab){
  busy(true);
  api('apiGetLTS',S.token,S.sub,id).then(function(d){
    busy(false); CUR=d; showDetail();
    if(tab){
      var tabs=document.querySelectorAll('.detail-tabs button');
      var idx={'d-spec':0,'d-diagram':1,'d-docs':2,'d-versions':3,'d-outages':4,'d-testing':5,'d-access':6}[tab];
      if(tabs[idx]){
        dtab(tabs[idx],tab);
        if(tab==='d-access') loadShares();
        if(tab==='d-versions') paintVersions();
        if(tab==='d-diagram') renderLtsDiagram();
        if(tab==='d-outages') paintOutages();
        if(tab==='d-testing') paintTesting();
      }
    }
  }).catch(function(e){busy(false);toast(e.message,'err');});
}
function showDetail(){
  var l=CUR.lts;
  var spec=[['Sr No',l.srNo],['Scheme end',l.endType==='other'?'Other substation end':'Own substation end'],
    ['Division',l.division],['Substation',l.substation],['Status',l.status],['Date',l.date],
    ['ICT / Line',l.tfIct],['HV / LV',l.hvLv],['Connected CTR',l.ctr],['Type of relay',l.relayType],

function docsByVersion(){

  if(!vs.length && !CUR.uploads.length) return '<div class="empty">No approvals or documents uploaded.</div>';
  var byVer={}; CUR.uploads.forEach(function(u){ (byVer[u.versionId||'']=byVer[u.versionId||'']||[]).push(u); });

  var out=vs.map(function(v){
    var ups=byVer[v.id]||[];
    if(!ups.length && !v.approvalFileId) return '';
    return '<section class="docgrp">'+
      '<header class="docgh"><span class="vno">v'+v.versionNo+'</span>'+
        (v.isCurrent?'<span class="pill ok">Current</span>':'<span class="pill off">Superseded</span>')+
        '<div style="flex:1"></div>'+
        '<span class="muted mono" style="font-size:11px">w.e.f. '+esc(fmtDate(v.functionalFrom))+'</span></header>'+
      (v.approvalFileId
        ? '<div class="apprrow">📎 <b>Approval copy</b> — '+
          '<a class="oplink" onclick="viewFile(\''+v.approvalFileId+'\',\'application/pdf\',\''+esc(v.approvalFileName)+'\',\'Approval copy — v'+v.versionNo+'\')">'+
          esc(v.approvalFileName)+'</a>'+

          '</div>'
        : '')+
      (ups.length?'<div class="uplist">'+ups.map(uCard).join('')+'</div>':'')+

  }).join('');

  var orphan=byVer['']||[];

      '<div class="uplist">'+orphan.map(uCard).join('')+'</div></section>';

/* =============================================================
   FILE VIEWER (Drive-style)
============================================================= */
var VZ=null;

function slugName(caption,fallback,mime){
  var base=String(caption||fallback||'attachment').trim()
    .replace(/\.[a-z0-9]{2,5}$/i,'')
    .replace(/[^\w\s\-\u0900-\u097F]/g,'')
    .replace(/\s+/g,'_').slice(0,70) || 'attachment';
  var ext = /pdf/i.test(mime) ? '.pdf'
    : /png/i.test(mime) ? '.png'
    : /webp/i.test(mime) ? '.webp'
    : /gif/i.test(mime) ? '.gif' : '.jpg';
  var m=String(fallback||'').match(/\.[a-z0-9]{2,5}$/i);
  if(m && !/pdf/i.test(mime)) ext=m[0].toLowerCase();
  return base+ext;
}

function viewFile(fileId,mime,name,caption){
  busy(true);
  Promise.all([
    api('apiGetFile',S.token,fileId),
    api('apiGetAnnotations',S.token,fileId).catch(function(){return [];})
  ]).then(function(r){
    busy(false); openViewer(r[0],mime,name,caption,fileId,r[1]);
  }).catch(function(e){busy(false);toast(e.message,'err');});
}

function openViewer(f,mime,name,caption,fileId,anns){
  var isPdf=/pdf/i.test(mime||f.mimeType);
  var blob=b64ToBlob(f.base64,mime||f.mimeType);
  var url=URL.createObjectURL(blob);
  VZ={scale:1,minS:.2,maxS:8,x:0,y:0,pdf:null,pages:1,
      isPdf:isPdf,url:url,blob:blob,fileId:fileId,
      fileName:slugName(caption,name,mime||f.mimeType),
      title:caption||name,
      rot:0,anns:anns||[],hl:false,drawing:null,
      drag:false,sx:0,sy:0,ox:0,oy:0,pinch:0,pinchS:1,
      canEdit:!!(CUR&&CUR.canEdit)};

  document.getElementById('viewerMount').innerHTML=
   '<div id="viewer">'+
     '<div class="vtop">'+
       '<button class="btn sm ghost" onclick="closeViewer()" title="Back (Esc)">‹ Back</button>'+
       '<span class="name">'+esc(caption||name)+'</span>'+
       (isPdf?'<span class="zbadge" id="pgBadge">1 / 1</span>':'')+
       '<button class="btn sm" onclick="zoomBy(-1)" title="Zoom out">−</button>'+
       '<span class="zbadge" id="zBadge">100%</span>'+
       '<button class="btn sm" onclick="zoomBy(1)" title="Zoom in">＋</button>'+
       '<button class="btn sm ghost" onclick="zoomReset()" title="Fit">⤢</button>'+
       '<button class="btn sm" onclick="rotateView()" title="Rotate 90° (R)">↻</button>'+
       (VZ.canEdit?'<button class="btn sm" id="hlBtn" onclick="toggleHl()" title="Highlight an area">🖍 Highlight</button>':'')+
       '<button class="btn sm" onclick="printCurrent()" title="Print">🖨 Print</button>'+
       '<button class="btn sm primary" onclick="downloadCurrent()">⬇ Download</button>'+
       '<button class="x" onclick="closeViewer()" title="Close (Esc)">✕</button>'+
     '</div>'+
     '<div class="vstage" id="vstage">'+
       '<div id="vscroll">'+
         (isPdf?'<div id="pdfPages" class="pagecol"></div>'
               :'<div class="pagewrap" data-page="1">'+
                  '<img id="vimg" src="'+url+'" alt="'+esc(caption||name)+'">'+
                  '<div class="annlayer" data-page="1"></div></div>')+
       '</div>'+
       '<div class="vhint" id="vhint">Scroll to move · Ctrl+scroll to zoom · double-click to zoom'+
         (VZ.canEdit?' · 🖍 then drag to highlight':'')+'</div>'+
     '</div>'+
   '</div>';

  document.addEventListener('keydown',viewerKeys);
  if(isPdf) loadPdf(); else bindImage();
  bindStage();
}

function closeViewer(){
  document.removeEventListener('keydown',viewerKeys);
  if(VZ && VZ.url) URL.revokeObjectURL(VZ.url);
  VZ=null;
  document.getElementById('viewerMount').innerHTML='';
}
function downloadCurrent(){ if(VZ) saveBlob(VZ.blob,VZ.fileName); }

/* print the attachment itself (image inline; PDF via its own object URL) */
function printCurrent(){
  if(!VZ) return;
  if(VZ.isPdf){
    var w=window.open(VZ.url);
    if(!w){ toast('Allow pop-ups to print the PDF','err'); return; }
    w.onload=function(){ w.focus(); w.print(); };
    return;
  }
  var f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  var d=f.contentWindow.document;
  d.open();
  d.write('<!doctype html><html><head><title>'+esc(VZ.title)+'</title><style>'+
    '@page{margin:10mm}body{margin:0;font-family:Calibri,sans-serif}'+
    'h3{font-size:12px;color:#7A5E12;margin:0 0 6px}'+
    'img{max-width:100%;height:auto}</style></head><body>'+
    '<h3>'+esc(VZ.title)+'</h3><img src="'+VZ.url+'"></body></html>');
  d.close();
  setTimeout(function(){ try{f.contentWindow.focus();f.contentWindow.print();}catch(e){} 
    setTimeout(function(){f.remove();},1200); },400);
}

function viewerKeys(e){
  if(!VZ) return;
  if(e.key==='Escape'){ if(VZ.hl){ toggleHl(); return; } closeViewer(); }
  else if(e.key==='+'||e.key==='='){ zoomBy(1); }
  else if(e.key==='-'){ zoomBy(-1); }
  else if(e.key==='0'){ zoomReset(); }
  else if(e.key==='r'||e.key==='R'){ rotateView(); }
}

/* ---------- zoom ---------- */
function setScale(v){
  if(!VZ) return;
  VZ.scale=Math.min(VZ.maxS,Math.max(VZ.minS,v));
  var b=document.getElementById('zBadge');
  if(b) b.textContent=Math.round(VZ.scale*100)+'%';
  if(VZ.isPdf) renderAllPages(); else applyImg();
}
function zoomBy(d){ setScale(VZ.scale*(d>0?1.25:1/1.25)); }
function rotateView(){
  if(!VZ) return;
  VZ.rot=(VZ.rot+90)%360;
  var sc=document.getElementById('vscroll');
  if(sc){
    /* rotate the page column; swap the box so scrollbars stay sane */
    sc.style.transform='rotate('+VZ.rot+'deg)';
    sc.style.transformOrigin='center center';
    sc.classList.toggle('rot90',VZ.rot===90||VZ.rot===270);
  }
  paintAnns();
}
function zoomReset(){ setScale(1); }
function applyImg(){
  var img=document.getElementById('vimg'); if(!img) return;
  img.style.width=(VZ.baseW*VZ.scale)+'px';
  img.style.height='auto';
}

function bindStage(){
  var st=document.getElementById('vstage');
  st.addEventListener('wheel',function(e){
    if(!e.ctrlKey && !e.metaKey) return;   /* plain scroll = move, like Drive */
    e.preventDefault();
    setScale(VZ.scale*(e.deltaY<0?1.1:1/1.1));
  },{passive:false});

  /* pinch */
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }
  st.addEventListener('touchstart',function(e){
    if(e.touches.length===2){ VZ.pinch=dist(e.touches); VZ.pinchS=VZ.scale; }
  },{passive:true});
  st.addEventListener('touchmove',function(e){
    if(e.touches.length===2 && VZ.pinch){ e.preventDefault(); setScale(VZ.pinchS*(dist(e.touches)/VZ.pinch)); }
  },{passive:false});
  st.addEventListener('touchend',function(e){ if(e.touches.length<2) VZ.pinch=0; });
}

function bindImage(){
  var img=document.getElementById('vimg');
  img.onload=function(){
    VZ.baseW=Math.min(img.naturalWidth, document.getElementById('vstage').clientWidth-40);
    applyImg();
    paintAnns();
  };
  img.addEventListener('dblclick',function(){ setScale(VZ.scale>1.05?1:2.2); });
  bindHighlight(img.parentNode);
}

/* ---------- continuous PDF, all pages stacked ---------- */
function loadPdf(){
  var box=document.getElementById('pdfPages');
  if(!window.pdfjsLib){ box.innerHTML='<p style="color:#fff;text-align:center;padding:40px">PDF viewer failed to load. Use Download.</p>'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  VZ.blob.arrayBuffer().then(function(buf){
    return pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    if(!VZ) return;
    VZ.pdf=pdf; VZ.pages=pdf.numPages;
    box.innerHTML='';
    for(var i=1;i<=pdf.numPages;i++){
      box.insertAdjacentHTML('beforeend',
        '<div class="pagewrap" data-page="'+i+'">'+
          '<canvas id="pg'+i+'"></canvas>'+
          '<div class="annlayer" data-page="'+i+'"></div>'+
        '</div>');
    }
    renderAllPages();
    trackPage();
    box.querySelectorAll('.pagewrap').forEach(bindHighlight);
  }).catch(function(){
    box.innerHTML='<p style="color:#fff;text-align:center;padding:40px">Could not render PDF. Use Download.</p>';
  });
}
function renderAllPages(){
  if(!VZ||!VZ.pdf) return;
  var stage=document.getElementById('vstage');
  var avail=Math.max(320, stage.clientWidth-48);
  for(var i=1;i<=VZ.pages;i++) renderOne(i,avail);
}
function renderOne(i,avail){
  VZ.pdf.getPage(i).then(function(page){
    if(!VZ) return;
    var base=page.getViewport({scale:1});
    var fit=avail/base.width;
    var vp=page.getViewport({scale:fit*VZ.scale});
    var cv=document.getElementById('pg'+i); if(!cv) return;
    cv.width=vp.width; cv.height=vp.height;
    cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){ paintAnns(); });
  });
}
function trackPage(){
  var sc=document.getElementById('vscroll');
  var stage=document.getElementById('vstage');
  stage.addEventListener('scroll',function(){
    var pages=sc.querySelectorAll('.pagewrap'), top=stage.scrollTop, cur=1;
    pages.forEach(function(p,i){ if(p.offsetTop-40<=top) cur=i+1; });
    var b=document.getElementById('pgBadge');
    if(b) b.textContent=cur+' / '+VZ.pages;
  });
}

/* ---------- highlights ---------- */
function toggleHl(){
  VZ.hl=!VZ.hl;
  var b=document.getElementById('hlBtn');
  if(b) b.classList.toggle('primary',VZ.hl);
  document.getElementById('vstage').classList.toggle('hlmode',VZ.hl);
  var h=document.getElementById('vhint');
  if(h) h.textContent = VZ.hl ? 'Drag across the area you want to highlight · Esc to cancel'
                              : 'Scroll to move · Ctrl+scroll to zoom · double-click to zoom';
}
function bindHighlight(wrap){
  wrap.addEventListener('mousedown',function(e){
    if(!VZ||!VZ.hl) return;
    e.preventDefault();
    var layer=wrap.querySelector('.annlayer');
    var r=layer.getBoundingClientRect();
    VZ.drawing={wrap:wrap,layer:layer,x0:e.clientX-r.left,y0:e.clientY-r.top,el:null};
  });
  wrap.addEventListener('mousemove',function(e){
    if(!VZ||!VZ.drawing||VZ.drawing.wrap!==wrap) return;
    var d=VZ.drawing, r=d.layer.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    if(!d.el){ d.el=document.createElement('div'); d.el.className='ann draft'; d.layer.appendChild(d.el); }
    d.el.style.left=Math.min(d.x0,x)+'px'; d.el.style.top=Math.min(d.y0,y)+'px';
    d.el.style.width=Math.abs(x-d.x0)+'px'; d.el.style.height=Math.abs(y-d.y0)+'px';
  });
  wrap.addEventListener('mouseup',function(e){
    if(!VZ||!VZ.drawing||VZ.drawing.wrap!==wrap) return;
    var d=VZ.drawing; VZ.drawing=null;
    if(!d.el){ return; }
    var r=d.layer.getBoundingClientRect();
    var W=r.width,H=r.height;
    var box={x:parseFloat(d.el.style.left)/W, y:parseFloat(d.el.style.top)/H,
             w:parseFloat(d.el.style.width)/W, h:parseFloat(d.el.style.height)/H};
    d.el.remove();
    if(box.w<0.005||box.h<0.005) return;           /* ignore stray clicks */
    var note=prompt('Note for this highlight (optional):','')||'';
    var page=Number(d.wrap.dataset.page)||1;
    busy(true);
    api('apiSaveAnnotation',S.token,VZ.fileId,
        {page:page,x:box.x,y:box.y,w:box.w,h:box.h,color:'#ffd54a',note:note})
      .then(function(res){
        busy(false);
        VZ.anns.push({id:res.id,page:page,x:box.x,y:box.y,w:box.w,h:box.h,color:'#ffd54a',
                      note:note,createdBy:S.user.username});
        paintAnns(); toast('Highlight saved','ok');
      }).catch(function(err){ busy(false); toast(err.message,'err'); });
  });
}
function paintAnns(){
  if(!VZ) return;
  document.querySelectorAll('#vscroll .annlayer').forEach(function(layer){
    var page=Number(layer.dataset.page)||1;
    var host=layer.parentNode.querySelector('canvas,img');
    if(host){ layer.style.width=host.clientWidth+'px'; layer.style.height=host.clientHeight+'px'; }
    layer.innerHTML=VZ.anns.filter(function(a){return (a.page||1)===page;}).map(function(a){
      return '<div class="ann" style="left:'+(a.x*100)+'%;top:'+(a.y*100)+'%;'+
        'width:'+(a.w*100)+'%;height:'+(a.h*100)+'%;background:'+a.color+'33;border-color:'+a.color+'" '+
        'title="'+esc(a.note||'Highlight')+' — '+esc(a.createdBy||'')+'">'+
        (VZ.canEdit?'<button class="anndel" onclick="event.stopPropagation();delAnn(\''+a.id+'\')">✕</button>':'')+
        (a.note?'<span class="annnote">'+esc(a.note)+'</span>':'')+
      '</div>';
    }).join('');
  });
}
function delAnn(id){
  api('apiDeleteAnnotation',S.token,id).then(function(){
    VZ.anns=VZ.anns.filter(function(a){return a.id!==id;});
    paintAnns(); toast('Highlight removed','ok');
  }).catch(function(e){toast(e.message,'err');});
}

    '<div class="actions"><button class="btn sm" onclick="openPreview(\'ops\')">👁 Preview</button>'+

    ], rangePickerHtml())+
    (S.canEdit?'<button class="btn primary sm" onclick="opForm()">+ Record operation</button>':'')+'</div></div>'+
    '<div id="opList" class="oplog"><div class="empty">Loading…</div></div>';
  if(S.opsLoaded===S.sub && S.ops){ paintOps(); return; }   /* instant from cache */
  api('apiGetOperations',S.token,S.sub).then(function(ops){
    S.ops=ops; S.opsLoaded=S.sub; paintOps();
  }).catch(function(e){toast(e.message,'err');});
}
function paintOps(){
  var box=document.getElementById('opList'); if(!box)return;
  if(!S.ops || !S.ops.length){box.innerHTML='<div class="empty">No operations recorded yet.</div>';return;}

  /* group LTS-wise; newest first inside each group, and groups ordered by
     their own most-recent operation (newest group at top) */
  var visible=opsInRange(S.ops);
  if(!visible.length){
    box.innerHTML='<div class="empty">No operations in '+esc(rangeLabel())+'.</div>'; return;
  }
  var groups={};
  visible.forEach(function(o){
    var k=o.ltsId||o.ltsName||'—';
    (groups[k]=groups[k]||{name:o.ltsName||'—',items:[]}).items.push(o);
  });
  var keys=Object.keys(groups);
  keys.forEach(function(k){
    groups[k].items.sort(function(a,b){ return new Date(b.interruptFrom)-new Date(a.interruptFrom); });
    groups[k].latest=new Date(groups[k].items[0].interruptFrom).getTime()||0;
  });
  keys.sort(function(a,b){ return groups[b].latest-groups[a].latest; });

  box.innerHTML=keys.map(function(k){
    var g=groups[k];
    return '<section class="opgroup">'+
      '<header class="opgh"><h4>'+esc(g.name)+'</h4>'+
        '<span class="pill off">'+g.items.length+' operation'+(g.items.length>1?'s':'')+'</span>'+
        '<div style="flex:1"></div>'+
        '<span class="muted mono" style="font-size:11px">last '+esc(fmtDate(g.items[0].interruptFrom))+'</span>'+
      '</header>'+
      g.items.map(opRow).join('')+
    '</section>';
  }).join('');
}
